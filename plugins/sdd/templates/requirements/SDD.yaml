# Konfiguracja procesu SDD dla tego projektu
project: "<nazwa projektu>"
level: full            # full | light
kind: monolith         # monolith | service - service: wdrazany osobno, rozmawia z reszta tylko przez kontrakt
owners:                # role biznesowe, ktore zatwierdzaja (rola, nie osoba)
  - role: "wlasciciel procesu"
    approves: [R, D, GLOSSARY]
  - role: "ksiegowosc"
    approves: [BR]
gate_blocking_status: "blokuje go-live"   # etykieta pytan blokujacych
backlog: none          # none | linear | jira | redmine | file
# Przy backlog: redmine (klucz API NIE tutaj - REDMINE_API_KEY albo Pek kluczy macOS):
# redmine_url: "https://redmine.firma.pl"
# redmine_project: "identyfikator-projektu"
# redmine_tracker: "Feature"   # opcjonalnie; brak = tracker typu funkcjonalnosc/zadanie (nigdy Bug)
# redmine_format: markdown       # markdown (tabele, obrazy) | textile - jak "Formatowanie tekstu" w Redmine
# redmine_ac_field: "Kryteria akceptacji"   # opcjonalnie: pole wlasne na kryteria (nazwa albo numer pola)
# redmine_uat_link: "https://uat.firma.pl/app"  # opcjonalnie: link do srodowiska UAT wpisywany w kazde zadanie
# redmine_uat_field: "Link do środowiska UAT"   # opcjonalnie: pole na link UAT (nazwa albo numer; to jest domyslne)
# redmine_status_start: "W realizacji"       # opcjonalnie: status, gdy agent zaczyna zadanie
# redmine_status_done: "Code review"         # opcjonalnie: status, gdy kod i testy sa gotowe

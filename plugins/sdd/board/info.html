<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SDD</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/ui.css">
<script src="/ui.js"></script>
<style>
/* Modul / Jak to dziala / Konfiguracja (0.34.0, design_handoff_sdd_kit_ui 3-4, docs/specs/ui-frame.md AC-F6..F8).
   Tokeny, rama, karta (.box), pola (.fld) i przyciski (.btn) - ui.css. */
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.45}
main{max-width:880px;padding:16px;display:flex;flex-direction:column;gap:12px}
body.guide main{max-width:1080px}
code{font-family:var(--mono);font-size:11.5px;background:var(--bg);border:1px solid var(--line);border-radius:2px;padding:1px 4px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
.hint{color:var(--muted);font-size:12.5px;margin:0}
.box h2{margin:0;font:600 10.5px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.box h2 .nn{color:var(--faint)}
.box .bb{padding:12px 16px}
.box .bb>p{margin:0 0 8px}
.box .bb>p:last-child{margin-bottom:0}
.tag{display:inline-block;font:600 10.5px/1.2 var(--mono);padding:4px 6px;border-radius:2px;color:#1d1b16;background:var(--bg);white-space:nowrap}
.tag.bad{background:var(--hot-ink);color:#fff}
.err{color:var(--hot-ink);font-size:12px;font-weight:600;margin:0}
.err:empty{display:none}
.ok{color:var(--ok);font-size:12px;font-weight:600;margin:0}

/* ---------- Modul */
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.mgrid .wide{grid-column:1 / -1}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:0;font-size:12.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.md ul,.md ol{margin:0 0 6px;padding-left:20px}
.md p{margin:0 0 6px}
.counts{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px;padding:0;list-style:none}
.counts li{display:inline-flex;align-items:baseline;gap:5px;padding:5px 9px;border:1px solid var(--line);border-radius:3px;background:var(--bg);font-size:12px;color:var(--muted)}
.counts b{font:600 14px var(--mono);color:var(--ink)}
.counts .warn b{color:var(--hot-ink)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.log{list-style:none;margin:0;padding:0}
.log li{padding:6px 0;border-top:1px solid var(--line-soft);font:11.5px/1.5 var(--mono);color:var(--muted);overflow-wrap:anywhere}
.log li:first-child{border-top:0}

/* ---------- Jak to dziala: spis tresci + tresc (3.1) */
.gwrap{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.toc{flex:0 0 190px;position:sticky;top:calc(var(--chrome-h,62px) + 16px);padding-bottom:6px}
.toc h2{padding:10px 12px 6px}
.toc ul{list-style:none;margin:0;padding:0}
.toc a{display:flex;gap:4px;padding:5px 12px;border-left:2px solid transparent;font-size:12.5px;color:var(--muted)}
.toc a:hover{color:var(--ink);text-decoration:none;background:var(--hover)}
.toc a:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.toc a .nn{flex:0 0 16px;font:10.5px/1.8 var(--mono);color:var(--faint)}
.toc a[aria-current="true"]{border-left-color:var(--accent);background:var(--cur-row);color:var(--ink);font-weight:600}
.toc .ex{display:block;margin-top:6px;padding:8px 12px 2px;border-top:1px solid var(--line-soft);font-size:12px;color:var(--muted)}
.gmain{flex:1 1 520px;min-width:0;display:flex;flex-direction:column;gap:12px}
.gmain>.box{scroll-margin-top:calc(var(--chrome-h,62px) + 16px)}
.gmain .bh .q{font-size:12.5px;color:var(--muted)}
.lead{margin:0 0 4px;font-size:20px;font-weight:600;letter-spacing:-.01em;line-height:1.25}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));border-top:1px solid var(--line-soft)}
.cols>div{padding:12px 16px;border-left:1px solid var(--line-soft);min-width:0}
.cols>div:first-child{border-left:0}
.cols .ab{font:600 11px var(--mono);color:var(--accent);margin-right:6px}
.cols h3{margin:0 0 4px;font-size:14px;font-weight:600}
.cols p{margin:0 0 8px;font-size:12.5px;color:var(--muted)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:12.5px;line-height:1.5}
.steps li{display:flex;gap:8px}
.steps .sn{flex:none;font:11px/1.7 var(--mono);color:var(--faint)}
.steps.muted li{color:var(--muted)}
.prow{display:grid;grid-template-columns:minmax(150px,190px) minmax(0,1fr);gap:4px 16px;padding:12px 16px;border-top:1px solid var(--line-soft)}
.prow:first-child{border-top:0}
.prow .pn{display:flex;gap:6px;align-items:baseline}
.prow .pn .sn{font:11px var(--mono);color:var(--faint)}
.prow .pn b{font-size:14px;font-weight:600}
.cmdc{display:inline-block;margin-top:6px;font:12px var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:4px 6px;white-space:nowrap}
.cmdc::before{content:"› ";color:var(--accent);white-space:pre}
.prow .pd{margin:0 0 6px;font-size:13px;line-height:1.5;font-weight:500}
.ctbl .th,.ctbl .tr{display:grid;grid-template-columns:minmax(150px,200px) minmax(0,1fr) minmax(120px,170px);gap:4px 14px;padding:8px 16px}
.ctbl .th{background:var(--bg);border-bottom:1px solid var(--line-soft);font:600 10px var(--mono);letter-spacing:.08em;color:var(--faint)}
.ctbl .grp{border-top:1px solid var(--line-soft)}
.ctbl .grp:first-of-type{border-top:0}
.ctbl .c1{font:600 12px var(--mono);overflow-wrap:anywhere}
.ctbl .c2{font-size:12.5px;line-height:1.5}
.ctbl .c3{font-size:12.5px;color:var(--muted)}
.ctbl .var{padding-top:0}
.ctbl .var .c1{padding-left:12px;font:11.5px var(--mono);color:var(--muted)}
.ctbl .var .c2{grid-column:2 / 4;font-size:12px;color:var(--muted)}
.frows .fr{display:grid;grid-template-columns:minmax(150px,200px) minmax(0,1fr);gap:4px 16px;padding:8px 16px;border-top:1px solid var(--line-soft)}
.frows .fr:first-child{border-top:0}
.frows .fp{font:600 12px var(--mono);overflow-wrap:anywhere}
.frows .fd{font-size:12.5px;color:var(--muted)}
.dash{list-style:none;margin:0;padding:12px 16px;display:flex;flex-direction:column;gap:6px;font-size:12.5px;line-height:1.55}
.dash li{display:flex;gap:8px}
.dash li::before{content:"–";color:var(--faint);flex:none}
.thesis{margin:0;padding:12px 16px 0;font-size:14px;font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;padding:10px 16px;background:var(--bg);border-top:1px solid var(--line-soft);font-size:12px;color:var(--muted)}
.legend .lg{display:inline-flex;align-items:center;gap:6px}
.legend i{display:grid;place-items:center;width:16px;height:16px;border-radius:50%;color:#fff;font:700 10px/1 var(--sans);font-style:normal}
.srcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 16px;padding:12px 16px}
.srcs .sh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.srcs .tag{font-size:12px}
.srcs .rk{font:10.5px var(--mono);color:var(--faint)}
.srcs p{margin:0;font-size:12.5px;color:var(--muted)}
.t-biz{background:var(--st-done)!important}.t-app{background:var(--st-app)!important}.t-dok{background:var(--bg)!important;color:var(--ink)!important;border:1px solid var(--line)}.t-ai{background:var(--st-work)!important}
.para{margin:0;padding:12px 16px;border-top:1px solid var(--line-soft);font-size:12.5px;line-height:1.55;color:var(--muted)}
.para b{color:var(--ink)}
.ids{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px 16px;padding:12px 16px;font-size:12.5px}
.ids div{display:flex;gap:8px}
.ids b{flex:0 0 28px;font:600 12px var(--mono)}
.ids span{color:var(--muted)}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:10px 16px;border-top:1px solid var(--line-soft);font-size:12.5px;color:var(--muted)}
.tag.ln{background:transparent;border:1px solid var(--line);color:var(--muted);padding:3px 5px}
.tag.okc{background:var(--st-done)}
.tag.hotc{background:transparent;border:1px solid var(--hot-ink);color:var(--hot-ink);padding:3px 5px}
.kinds{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));border-bottom:1px solid var(--line-soft)}
.kinds>div{padding:12px 16px;border-left:1px solid var(--line-soft)}
.kinds>div:first-child{border-left:0}
.kinds b.kn{display:block;margin-bottom:4px;font:600 12.5px var(--mono)}
.kinds p{margin:0;font-size:12.5px;color:var(--muted)}
.w-acc{color:var(--accent);font-weight:600}.w-hot{color:var(--hot-ink);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:12px 16px 0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border:1px solid var(--line);border-radius:3px;background:var(--bg);font-size:12px}
.chip i{width:10px;height:10px;border-radius:2px}
.pairs .pr{display:grid;grid-template-columns:minmax(130px,170px) minmax(0,1fr);gap:4px 16px;padding:10px 16px;border-top:1px solid var(--line-soft)}
.pairs .pr:first-child{border-top:0}
.pairs .pk{font-size:12.5px;font-weight:600}
.pairs .pv{font-size:12.5px;line-height:1.6;color:var(--muted);overflow-wrap:anywhere}

/* ---------- Konfiguracja (4) */
.bh .path{font:11px var(--mono);color:var(--faint);overflow-wrap:anywhere}
.fr2{display:flex;flex-wrap:wrap;gap:6px 16px;padding:12px 16px;border-top:1px solid var(--line-soft)}
.box>.bh+.fr2{border-top:0}
.fr2 .fl{flex:0 0 200px;min-width:0}
.fr2 .fl>b{display:block;font-size:13px;font-weight:600}
.fr2 .fl>small{display:block;margin-top:2px;font-size:11.5px;line-height:1.4;color:var(--muted)}
.fr2 .fc{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.fr2 .fc>.fld{width:100%}
.fr2 .fc .w360{max-width:360px}.fr2 .fc .w280{max-width:280px}
.fr2 .rowc{display:flex;flex-wrap:wrap;gap:8px;width:100%;align-items:center}
.fr2 .rowc .fld{flex:1 1 220px}
.seg{display:inline-flex;border:1px solid var(--input-line);border-radius:3px;overflow:hidden;align-self:flex-start}
.seg button{height:28px;padding:0 12px;border:0;border-left:1px solid var(--input-line);background:var(--input);color:var(--ink);font:12px var(--mono);cursor:pointer}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.seg button:disabled{cursor:not-allowed}
.khint{font-size:12px;color:var(--muted)}
.rmbox{margin:0 16px 12px;border:1px solid var(--line);border-radius:3px;background:var(--bg)}
.rmbox[hidden]{display:none}
.rmbox>.sl-lbl{display:block;padding:10px 12px 0}
.rmbox .fr2{padding:10px 12px;border-top-color:var(--line-soft)}
.rmbox .fr2:nth-child(2){border-top:0}
.rmbox .fr2 .fl{flex-basis:188px}
.kst{display:inline-flex!important;align-items:center;gap:6px;margin-top:4px!important}
.kst i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.kst.set i{background:#2f9e5b}.kst.new i{background:var(--accent)}.kst.none i{background:var(--hot-ink)}
.knote{font-size:11.5px;color:var(--muted);margin:0}
.roles{display:flex;flex-direction:column;gap:8px;width:100%}
.role{border:1px solid var(--line);border-radius:3px;background:var(--bg);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.role .rh{display:flex;align-items:baseline;gap:8px}
.role .rn{font-weight:600}
.role .rs{font:10.5px var(--mono);color:var(--faint)}
.role .rdel{margin-left:auto;border:0;background:none;padding:0;font:12px var(--sans);color:var(--hot-ink);cursor:pointer}
.role .rdel:disabled{color:var(--faint);cursor:not-allowed}
.role .rn-in{height:26px}
.perms{display:flex;flex-wrap:wrap;gap:6px}
.perm{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border:1px solid var(--line);border-radius:3px;background:transparent;color:var(--muted);font:12px var(--sans);cursor:pointer}
.perm .bx{display:grid;place-items:center;width:12px;height:12px;border:1px solid var(--input-line);border-radius:2px;color:#fff;font-size:9px;line-height:1}
.perm .cd{font:600 11.5px var(--mono)}
.perm[aria-pressed="true"]{border-color:var(--input-line);background:var(--input);color:var(--ink)}
.perm[aria-pressed="true"] .bx{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.perm:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.perm:disabled{cursor:not-allowed}
.addr{display:flex;flex-wrap:wrap;gap:8px;width:100%}
.addr .fld{flex:1 1 220px;max-width:360px}
.zc{font:600 10px/1 var(--mono);letter-spacing:.06em;border:1px solid var(--line);border-radius:2px;padding:3px 4px;color:var(--muted);display:inline-block!important;margin-top:6px!important}
.val{font:600 13px var(--mono)}
.cmdf{display:flex;align-items:stretch;height:28px;border:1px solid var(--input-line);border-radius:3px;background:var(--input);overflow:hidden;max-width:100%}
.cmdf code{display:flex;align-items:center;border:0;border-radius:0;background:none;padding:0 9px;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmdf code::before{content:"› ";color:var(--accent);white-space:pre}
.cmdf button{flex:none;border:0;border-left:1px solid var(--input-line);background:var(--ink);color:var(--bg);font:600 12px/1 var(--sans);padding:0 10px;cursor:pointer}
.savebar{position:sticky;bottom:0;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 16px;background:var(--panel);border-top:1px solid var(--line);border-radius:0 0 4px 4px}
.savebar #savesdd{height:30px}
.savebar #savesdd:disabled{background:transparent;border-color:var(--line);color:var(--faint);opacity:1}
.savebar #resetsdd:disabled{opacity:.5}
.sst{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--faint)}
.sst i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.sst.dirty{color:var(--accent)}.sst.dirty i{background:var(--accent)}
.sst.saved{color:#2f9e5b}.sst.saved i{background:#2f9e5b}
.sst.err{color:var(--hot-ink);font-weight:600}.sst.err i{background:var(--hot-ink)}
.mods{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;width:100%}
.mods li{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:6px 6px 6px 10px;border:1px solid var(--line);border-radius:3px;background:var(--bg)}
.mods .path{flex:1 1 200px;min-width:0;font:12px var(--mono);overflow-wrap:anywhere}
.preview{font-size:12.5px;width:100%}
.preview p{margin:0 0 6px}
.srv .sv{display:flex;flex-wrap:wrap;gap:2px 16px;padding:7px 16px;border-top:1px solid var(--line-soft)}
.srv .sv:first-of-type{border-top:0}
.srv .sk{flex:0 0 200px;font-size:12.5px;color:var(--muted)}
.srv .sval{flex:1 1 260px;min-width:0;font:500 12px var(--mono);overflow-wrap:anywhere}
.srv .sval small{font:11.5px var(--sans);color:var(--faint);margin-left:6px}
.srv .sval a{text-decoration:underline}
.srv .sval .stale{color:var(--hot-ink);font-weight:600}
.srvupd{display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-left:12px;font:600 12px var(--sans);color:#2f9e5b}
.srvupd[hidden]{display:none}
.srvupd .updi{display:grid;place-items:center;width:16px;height:16px;border-radius:50%;background:#2f9e5b;color:#fff;font:700 11px/1 var(--sans);font-style:normal}
.srvupd a{font-weight:400;color:var(--muted)}
.srvupd .btn{height:26px}
@media(max-width:640px){
  main{padding:12px}
  .toc{position:static;flex-basis:100%}
  .prow,.ctbl .th,.ctbl .tr,.frows .fr,.pairs .pr{grid-template-columns:1fr}
  .ctbl .th{display:none}
  .ctbl .var .c2{grid-column:auto}
  .fr2 .fl{flex-basis:100%}
}
</style>
</head>
<body>
<div class="chrome">
<div class="statusbar">
  <span class="live" id="live"><i aria-hidden="true"></i><span>na żywo: <span id="conn">łączę…</span></span></span>
  <span class="meta" id="meta"></span>
</div>
<nav class="topbar" id="topbar" aria-label="Widok">
  <span class="modsw" data-slot="mod">
    <button type="button" id="modbtn" aria-haspopup="true" aria-expanded="false" aria-controls="modmenu" title="Przełącz moduł albo załóż nowy"><span class="mname">…</span><span class="car" aria-hidden="true">▾</span></button>
    <div id="modmenu" class="modmenu" role="menu" hidden></div>
  </span>
</nav>
</div>
<script>
  // strona z adresu: /module, /guide, /config (z przedrostkiem /demo albo /demo/start)
  var PAGE=(location.pathname.match(/\/(module|guide|config)\/?$/)||[])[1]||'guide';
  document.getElementById('topbar').setAttribute('data-page',PAGE);
  document.body.className=PAGE;
</script>
<main id="app"><p class="muted">Wczytuję…</p></main>
<script>
(function(){
  var BASE=SddUI.base(location.pathname);
  var $=function(s){return document.querySelector(s)};
  var LEVEL={full:'pełny',light:'lekki'};
  var KIND={monolith:'monolit (aplikacja wdrażana w całości)',service:'serwis (wdrażany osobno, rozmawia przez kontrakt)'};
  document.title='SDD';  // po wczytaniu modulu: "SDD: <modul>" (SddUI.tabTitle, AC-U19)
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function api(url,opts){
    opts=opts||{}; opts.headers=Object.assign({'X-SDD':'1','Content-Type':'application/json'},opts.headers||{});
    return fetch(BASE+url,opts).then(function(r){return r.json().catch(function(){return {}}).then(function(j){
      if(!r.ok){ var e=new Error(j.error||(r.status===404?'Serwer jest starszy niż strona - zatrzymaj go (Ctrl+C) i uruchom ponownie.':'HTTP '+r.status)); e.data=j; throw e; }
      return j;})});
  }
  // Prosty markdown sekcji PRD: listy "- " i "1. ", akapity, `kod`, **pogrubienie**.
  function inline(s){return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')}
  function md(text){
    if(!text) return '';
    // linie zawiniete w pliku lacza sie w jeden akapit / jeden punkt listy; pusta linia konczy akapit
    var out='', list=null, para=[];
    function flush(){ if(para.length){ out+='<p>'+inline(para.join(' '))+'</p>'; para=[]; } }
    text.split('\n').forEach(function(l){
      var m=l.match(/^\s*(?:[-*]|\d+\.)\s+(.*)$/);
      if(m){ flush(); var t=/^\s*\d+\./.test(l)?'ol':'ul'; if(list!==t){ if(list) out+='</'+list+'>'; out+='<'+t+'>'; list=t; } out+='<li>'+inline(m[1])+'</li>'; return; }
      if(!l.trim()){ flush(); if(list){ out+='</'+list+'>'; list=null; } return; }
      if(list){ out=out.replace(/<\/li>$/,' '+inline(l.trim())+'</li>'); return; }
      para.push(l.trim());
    });
    flush();
    return out+(list?'</'+list+'>':'');
  }

  // ---------------------------------------------------------------- naglowek (modul) i SSE
  var setModule=SddUI.modSwitch({ onNew:function(){ location.href=(BASE||'')+'/#nowy-modul'; } });
  var lastModuleKey=null;
  function header(p){
    var cur=p.module?(p.module.dir||p.module.name):'';
    setModule(cur,p.modules||[],p.demo);
    // pasek stanu jak w Panelu (handoff 1.1): "3 z 6 etapow gotowych · poziom pelny · monolit"

  function chromeH(){ var c=document.querySelector('.chrome'); return c&&getComputedStyle(c).position==='sticky'?c.getBoundingClientRect().height:0; }
  var spyOn=false;
  function tocSpy(){
    document.documentElement.style.setProperty('--chrome-h',chromeH()+'px');
    function spy(){
      var links=[].slice.call(document.querySelectorAll('.toc a[href^="#"]')); if(!links.length) return;
      var top=chromeH()+40, cur=links[0];
      links.forEach(function(a){ var s=document.getElementById(a.getAttribute('href').slice(1)); if(s&&s.getBoundingClientRect().top<=top) cur=a; });
      if(window.innerHeight+window.scrollY>=document.documentElement.scrollHeight-2) cur=links[links.length-1];
      links.forEach(function(a){ if(a===cur) a.setAttribute('aria-current','true'); else a.removeAttribute('aria-current'); });
    }
    document.querySelector('.toc').onclick=function(e){
      var a=e.target.closest('a[href^="#"]'); if(!a) return;
      var s=document.getElementById(a.getAttribute('href').slice(1)); if(!s) return;
      e.preventDefault(); history.replaceState(null,'','#'+s.id);
      window.scrollTo({top:s.getBoundingClientRect().top+window.scrollY-chromeH()-16,behavior:'smooth'});
    };
    if(!spyOn){ spyOn=true; window.addEventListener('scroll',spy,{passive:true}); window.addEventListener('resize',function(){document.documentElement.style.setProperty('--chrome-h',chromeH()+'px');spy();}); }
    spy();
    // wejscie z kotwica (#integracja-z-redmine): przewin po zbudowaniu strony
    if(location.hash&&!tocSpy.done){ tocSpy.done=true; var s=document.getElementById(location.hash.slice(1)); if(s) window.scrollTo({top:s.getBoundingClientRect().top+window.scrollY-chromeH()-16}); }

          frow('Adres Redmine','np. https://redmine.firma.pl','<input type="text" class="fld mono" inputmode="url" id="f-rmurl" name="sdd-rm-url" autocomplete="off" data-1p-ignore data-lpignore="true" data-form-type="other" value="'+esc(c.sdd.redmineUrl||'')+'"'+(demo?' disabled':'')+'>')+
          frow('Projekt','identyfikator albo wklejony adres projektu','<input type="text" class="fld w280" id="f-rmproj" name="sdd-rm-project" autocomplete="off" data-1p-ignore data-lpignore="true" data-form-type="other" value="'+esc(c.sdd.redmineProject||'')+'"'+(demo?' disabled':'')+'>')+
          frow('Klucz API','',(demo?'<p class="knote">W demo klucza nie ustawiasz.</p>':
            // klucz: zwykly tekst bez maski - maska wlacza w Safari logowanie z aplikacji Hasla (0.28.7)
            '<div class="rowc"><input type="text" class="fld mono w280" id="f-rmkey" name="sdd-rm-key" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-1p-ignore data-lpignore="true" data-form-type="other" placeholder="'+(c.redmineKey==='none'?'wklej klucz: Moje konto → Klucz dostępu do API':'nowy klucz (zastąpi obecny)')+'">'+
            '<button class="btn danger" type="button" id="delkey"'+(c.redmineKey==='file'?'':' disabled title="'+(c.redmineKey==='none'?'Brak klucza':'Klucz nie jest w pliku .env - usuń go tam, gdzie jest ustawiony')+'"')+'>Usuń klucz</button></div>')+
            '<p class="knote">Klucz widać tylko podczas wklejania. Trafia do <code>~/.sdd-kit/.env</code> na tym komputerze – czyta go tylko sdd-kit, Claude go nie otwiera, nie trafia do repo.</p>'+
            '<p class="err" id="keyerr">'+esc(msg.keyerr||'')+'</p>'+(msg.keyok?'<p class="ok">'+esc(msg.keyok)+'</p>':''),
            '<small class="kst" id="kst"></small>')+
        '</div>'+
        frow('Role i co zatwierdzają','rola, nie osoba; roli użytej już w plikach nie da się tu usunąć','<div class="roles" id="owners"></div>'+
          (demo?'':'<div class="addr"><input type="text" class="fld" id="f-role" placeholder="nazwa roli, np. księgowość" autocomplete="off"><button class="btn" type="button" id="addrole">+ Dodaj rolę</button></div>'))+
        frow('Poziom','','<span class="val">'+esc(LEVEL[c.sdd.level]||c.sdd.level)+'</span><span class="khint">Zmiana przebudowuje pliki (PRD.md ↔ SPEC.md), więc robi ją Claude. W Claude Code, w folderze modułu:</span>'+
          '<div class="cmdf"><code id="lvlcmd">zmień poziom modułu na '+(c.sdd.level==='full'?'lekki':'pełny')+'</code><button type="button" id="lvlcopy">Kopiuj</button></div>','<small class="zc">ZMIENIA CLAUDE</small>')+
        frow('Etykieta pytań blokujących','','<span class="val">„'+esc(c.sdd.gate)+'”</span><span class="khint">Pytania w QUESTIONS.md mają tę etykietę; zmiana tylko tutaj po cichu odblokowałaby go-live. Poproś Claude o zmianę etykiety - przepisze ją też w pytaniach.</span>','<small class="zc">ZMIENIA CLAUDE</small>')+
        (demo?'':'<div class="savebar"><button class="btn p" type="button" id="savesdd">Zapisz ustawienia modułu</button><button class="btn" type="button" id="resetsdd">Cofnij zmiany</button>'+
          '<span class="sst" id="sst"><i aria-hidden="true"></i><span></span></span><span class="err" id="sdderr">'+esc(msg.sdderr||'')+'</span></div>');
    }
    h+='</section>';
    // KATALOG MODULOW (ten komputer)
    h+='<section class="box" id="katalog"><div class="bh"><h2>Katalog modułów</h2><span class="path">ten komputer · ~/.sdd-kit/config.json</span></div>';
    if(demo) h+='<div class="bb"><p class="hint">W demo katalog jest stały.</p></div>';
    else {
      h+=frow('Teraz',esc(SRC[c.rootSource]||'wybór z panelu'),'<span class="val" style="font-size:12.5px;overflow-wrap:anywhere">'+(c.modulesRoot?esc(c.modulesRoot):'nie wybrano')+'</span>'+
          '<div class="rowc"><input type="text" class="fld mono" id="f-root" placeholder="/Users/…/wymagania albo ~/wymagania" value="'+esc(msg.root||'')+'"><button class="btn" type="button" id="checkroot">Sprawdź</button></div>'+
          '<div class="preview" id="rootprev">'+(msg.rootprev||'')+'</div><p class="err" id="rooterr">'+esc(msg.rooterr||'')+'</p>'+
          '<p class="knote">Zmiana nie przenosi ani nie kasuje plików – panel szuka modułów w innym miejscu.</p>')+
        frow('Projekty spoza katalogu','usunięcie z listy nie kasuje plików',(c.modules.length?'<ul class="mods">'+c.modules.map(function(m){
            return '<li><span class="path">'+esc(m.dir)+'</span>'+(m.exists?'':'<span class="tag bad">nie ma folderu</span>')+
              (msg.rmask===m.dir?'<button class="btn danger" type="button" data-rmok="'+esc(m.dir)+'">Tak, usuń z listy</button><button class="btn" type="button" data-rmno="1">Nie</button>'
                :'<button class="btn danger" type="button" data-rm="'+esc(m.dir)+'">Usuń z listy</button>')+'</li>'}).join('')+'</ul>'
          :'<p class="knote">Brak. Moduły z katalogu są widoczne bez dodawania.</p>')+
          '<div class="rowc"><input type="text" class="fld mono" id="f-add" placeholder="ścieżka projektu z requirements/SDD.yaml"><button class="btn" type="button" id="addmod">Dodaj</button></div>'+
          '<p class="err" id="adderr">'+esc(msg.adderr||'')+'</p>');
    }
    h+='</section>';
    // SERWER (tylko podglad); wersja z ostrzezeniami i "Przyklad gotowego modulu" przeniesione z naglowka (handoff 1.2)
    var s=c.server||{};
    function sv(k,v,note){return '<div class="sv"><span class="sk">'+k+'</span><span class="sval">'+v+(note?'<small>'+note+'</small>':'')+'</span></div>'}
    h+='<section class="box srv"><div class="bh"><h2>Serwer</h2><span class="path">tylko podgląd</span></div>'+
      sv('Wersja sdd-kit','<a id="srvver" href="https://github.com/SyBeer/sdd-kit/releases/tag/v'+esc(s.version||'')+'" target="_blank" rel="noopener" title="Opis zmian tej wersji na GitHubie">'+esc(s.version||'-')+'</a><span class="srvupd" id="srvupd" hidden></span>')+
      sv('Port',esc(s.port),'inny port: sdd-board &lt;plik tablicy&gt; &lt;port&gt;')+
      (s.board?sv('Plik tablicy',esc(s.board)):'')+
      (s.config?sv('Konfiguracja',esc(s.config)):'')+
      (c.lastModule?sv('Ostatni moduł',esc(c.lastModule),'otwierany przy starcie'):'')+
      (c.kitDir?sv('Aplikacja',esc(c.kitDir)):'')+
      (BASE?'':sv('Przykład','<a href="/demo" target="_blank" rel="noopener">Przykład gotowego modułu ↗</a>'))+'</section>';
    $('#app').innerHTML=h;
    if(c.sdd) drawOwners();
    msg.rmask=null; msg.adderr=''; msg.sdderr=''; msg.rooterr=''; msg.rootprev=''; msg.root='';
    versionNote();
    if(c.sdd) dirty();
    if(!demo) bindConfig();
  }
  // Wersja w karcie Serwer: ostrzezenia jak w naglowku (serwer / plugin / sesja Claude nieaktualne)
  function versionNote(){
    fetch(BASE+'/api/version').then(function(r){return r.ok?r.json():null}).then(function(v){
      var x=SddUI.versionBadge(v), el=$('#srvver'); if(!x||!el) return;
      el.textContent=x.text; el.title=x.title; el.href=x.href; el.classList.toggle('stale',x.stale);
    }).catch(function(){});
    // nowa wersja na GitHubie (0.35.1, AC-UP9): zielona strzalka, "jest nowa wersja X", Aktualizuj = okienko z paska stanu
    if(BASE) return;
    fetch(BASE+'/api/update').then(function(r){return r.ok?r.json():null}).then(function(u){
      var box=$('#srvupd'); if(!u||!u.newer||!box) return;
      box.innerHTML='<i class="updi" aria-hidden="true">↓</i><span>jest nowa wersja '+esc(u.latest)+'</span>'+
        (u.url?'<a href="'+esc(u.url)+'" target="_blank" rel="noopener">co nowego ↗</a>':'')+
        '<button class="btn" type="button" id="srvupdgo">Aktualizuj…</button>';
      box.hidden=false;
      $('#srvupdgo').onclick=function(e){ e.stopPropagation(); if(!SddUI.openUpdate()) location.reload(); };
    }).catch(function(){});
  }
  function drawOwners(){
    var demo=!!cfg.demo, all=cfg.sdd.approvesAllowed, used=cfg.sdd.usedRoles||[];
    var saved=cfg.sdd.owners.map(function(o){return o.role});
    $('#owners').innerHTML=ownersDraft.map(function(o,i){
      var isUsed=used.indexOf(o.role)>=0, isNew=saved.indexOf(o.role)<0;
      return '<div class="role"><div class="rh"><span class="rn">'+esc(o.role)+'</span><span class="rs">'+(isUsed?'użyta w plikach':isNew?'nowa':'')+'</span>'+
        (demo?'':'<button class="rdel" type="button" data-delrole="'+i+'" aria-label="Usuń rolę '+esc(o.role)+'"'+(isUsed?' disabled title="Rola występuje w plikach wymagań - zmianę nazwy we wszystkich plikach zrobi Claude"':'')+'>Usuń</button>')+'</div>'+
        '<div class="perms" role="group" aria-label="Co zatwierdza '+esc(o.role)+'">'+all.map(function(a){var on=o.approves.indexOf(a)>=0;
          return '<button type="button" class="perm" data-ap="'+i+'" data-v="'+a+'" aria-pressed="'+on+'"'+(demo?' disabled':'')+'><span class="bx" aria-hidden="true">'+(on?'✓':'')+'</span><span class="cd">'+esc(a)+'</span><span>'+esc(SddUI.ABBR[a]||'')+'</span></button>'}).join('')+'</div></div>';
    }).join('');
  }
  // Co sie zmienilo wzgledem SDD.yaml - to samo, co trafi do zapisu (pasek zapisu 4.2)
  function changes(){
    var body={}, owners=ownersDraft.map(function(o){return {role:o.role.trim(),approves:o.approves.slice().sort()}});
    var was=cfg.sdd.owners.map(function(o){return {role:o.role,approves:o.approves.slice().sort()}});
    if($('#f-project').value.trim()!==cfg.sdd.project) body.project=$('#f-project').value;
    if($('#f-backlog').value!==cfg.sdd.backlog) body.backlog=$('#f-backlog').value;
    if($('#f-kind')&&$('#f-kind').value!==cfg.sdd.kind) body.kind=$('#f-kind').value;
    if($('#f-style')&&$('#f-style').value!==(cfg.sdd.interviewStyle||'biz')) body.interview_style=$('#f-style').value;
    if($('#f-backlog').value==='redmine'){
      if($('#f-rmurl').value.trim()!==(cfg.sdd.redmineUrl||'')) body.redmine_url=$('#f-rmurl').value;
      if($('#f-rmproj').value.trim()!==(cfg.sdd.redmineProject||'')) body.redmine_project=$('#f-rmproj').value;
    }
    if(JSON.stringify(owners)!==JSON.stringify(was)) body.owners=owners;
    var key=$('#f-backlog').value==='redmine'&&$('#f-rmkey')?$('#f-rmkey').value.trim():'';
    return {body:body,key:key,any:Object.keys(body).length>0||!!key};
  }
  function dirty(){
    var k=keyState(), kst=$('#kst'); if(kst){ kst.className='kst '+k[0]; kst.innerHTML='<i aria-hidden="true"></i>'+esc(k[1]); }
    var sv=$('#savesdd'); if(!sv) return;
    var ch=changes(), st=$('#sst'), err=$('#sdderr');
    sv.disabled=!ch.any; $('#resetsdd').disabled=!ch.any;
    var state=ch.any?['dirty','niezapisane zmiany']:msg.sddok?['saved','zapisano w SDD.yaml']:['','bez zmian'];
    if(err&&err.textContent) state=['err',''];
    st.className='sst '+state[0]; st.lastChild.textContent=state[1]; st.firstChild.hidden=!state[1];
  }
  function bindConfig(){
    var app=$('#app');
    app.oninput=function(e){
      editing=true; msg.sddok=''; if($('#sdderr')) $('#sdderr').textContent='';
      dirty();
    };
    app.onkeydown=function(e){ if(e.key==='Enter'&&e.target.id==='f-role'){ e.preventDefault(); addRole(); } };
    function addRole(){
      var i=$('#f-role'), n=i.value.trim(); if(!n) { i.focus(); return; }
      editing=true; msg.sddok=''; ownersDraft.push({role:n,approves:[]}); drawOwners(); i.value=''; i.focus(); dirty();
    }
    app.onclick=function(e){
      var t=e.target.closest('button'); if(!t||t.disabled) return;
      var sg=t.parentNode.getAttribute('data-seg');
      if(sg){
        editing=true; msg.sddok=''; var sel=$('#'+sg); sel.value=t.getAttribute('data-v');
        [].forEach.call(t.parentNode.children,function(b){b.setAttribute('aria-pressed',b===t)});
        if(sg==='f-backlog'){ var rf=$('#rmf'); if(rf) rf.hidden=sel.value!=='redmine'; }
        if(sg==='f-kind') $('#kindhint').textContent=KIND_HINT[sel.value]||'';
        if(sg==='f-style') $('#stylehint').textContent=STYLE_HINT[sel.value]||'';
        dirty(); return;
      }
      if(t.hasAttribute('data-ap')){
        editing=true; msg.sddok=''; var o=ownersDraft[+t.getAttribute('data-ap')], v=t.getAttribute('data-v');
        o.approves=o.approves.filter(function(a){return a!==v}); if(t.getAttribute('aria-pressed')!=='true') o.approves.push(v);
        drawOwners(); var nb=app.querySelector('.perm[data-ap="'+t.getAttribute('data-ap')+'"][data-v="'+v+'"]'); if(nb) nb.focus(); dirty(); return;
      }
      if(t.id==='lvlcopy'){ try{navigator.clipboard.writeText($('#lvlcmd').textContent).then(function(){t.textContent='Skopiowano';setTimeout(function(){t.textContent='Kopiuj'},1500)})}catch(err){} return; }
      if(t.id==='delkey'){ if(confirm('Usunąć klucz API Redmine z ~/.sdd-kit/.env?')) saveKey(''); return; }
      if(t.id==='addrole') addRole();
      else if(t.hasAttribute('data-delrole')){ editing=true; msg.sddok=''; ownersDraft.splice(+t.getAttribute('data-delrole'),1); drawOwners(); dirty(); }
      else if(t.id==='resetsdd'){ editing=false; msg.sddok=''; load(); }
      else if(t.id==='savesdd') saveSdd(t);
      else if(t.id==='checkroot') checkRoot();
      else if(t.id==='setroot') setRoot(t);
      else if(t.hasAttribute('data-rm')){ msg.rmask=t.getAttribute('data-rm'); renderConfig(cfg); }
      else if(t.hasAttribute('data-rmno')) renderConfig(cfg);
      else if(t.hasAttribute('data-rmok')) api('/api/modules?dir='+encodeURIComponent(t.getAttribute('data-rmok')),{method:'DELETE'}).then(renderConfig).catch(function(err){msg.adderr=err.message;renderConfig(cfg)});
      else if(t.id==='addmod') api('/api/modules/add',{method:'POST',body:JSON.stringify({path:$('#f-add').value})}).then(function(){editing=false;load()}).catch(function(err){$('#adderr').textContent=err.message});
    };
  }
  function saveSdd(btn){
    // tylko zmienione pola - wpis w CHANGELOG.md mowi, co naprawde sie zmienilo
    var ch=changes(), body=ch.body, key=ch.key, hasSdd=Object.keys(body).length>0;
    if(!ch.any){ $('#sdderr').textContent='Brak zmian do zapisania.'; dirty(); return; }
    btn.disabled=true; $('#sdderr').textContent=''; msg.keyok=''; msg.keyerr='';
    var done=[];
    (hasSdd?api('/api/config',{method:'PUT',body:JSON.stringify(body)}).then(function(c){ done.push('SDD.yaml i CHANGELOG.md'); return c; }):Promise.resolve(null))
      .then(function(c){ return key?api('/api/secrets',{method:'PUT',body:JSON.stringify({REDMINE_API_KEY:key})}).then(function(c2){ done.push('klucz w ~/.sdd-kit/.env'); return c2; }):c; })
      .then(function(c){
        editing=false; msg.sddok='Zapisane: '+done.join(', ')+'.'; if(done.length===1&&!hasSdd) msg.keyok='Klucz zapisany.';
        renderConfig(c);
        // "zapisano w SDD.yaml" przez 2,5 s, potem "bez zmian"
        clearTimeout(savedTimer); savedTimer=setTimeout(function(){ msg.sddok=''; if(!editing&&$('#sst')) dirty(); },2500);
      })
      .catch(function(err){ btn.disabled=false; $('#sdderr').textContent=(done.length?'Zapisane: '+done.join(', ')+'. ':'')+err.message; dirty(); });
  }
  function checkRoot(){
    var p=$('#f-root').value.trim(); $('#rooterr').textContent=''; $('#rootprev').innerHTML='';
    if(!p) return;
    api('/api/root/preview?path='+encodeURIComponent(p)).then(function(r){
      var h='<p><code>'+esc(r.path)+'</code>'+(r.exists?'':' - folder zostanie założony')+'</p>';
      h+='<p>Będą widoczne: '+(r.visible.length?'<b>'+r.visible.map(esc).join(', ')+'</b>':'<span class="muted">żadne moduły</span>')+'</p>';
      if(r.hidden.length) h+='<p>Znikną z listy: <b>'+r.hidden.map(esc).join(', ')+'</b> <span class="muted">(pliki zostają; żeby je widzieć, dodaj je w „Projekty dodane”)</span></p>';
      h+='<button class="btn p" type="button" id="setroot" data-path="'+esc(r.path)+'">Zmień katalog na ten</button>';
      $('#rootprev').innerHTML=h;
    }).catch(function(err){ $('#rooterr').textContent=err.message; });
  }
  function setRoot(btn){
    btn.disabled=true;
    api('/api/root',{method:'POST',body:JSON.stringify({path:btn.getAttribute('data-path')})}).then(function(){ editing=false; load(); })
      .catch(function(err){ btn.disabled=false; $('#rooterr').textContent=err.message; });
  }
  if(PAGE==='guide'&&BASE==='/demo/start') return;
  if(PAGE==='guide') load();
})();
</script>
</body>
</html>

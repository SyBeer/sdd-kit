<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Postęp SDD</title>
<link rel="stylesheet" href="/ui.css">
<script src="/ui.js"></script>
<style>
:root{
  --bg:#e9e6df; --board:#f6f4ee; --ink:#26241f; --muted:#6b675c; --line:#cfcabd; --panel:#fff;
  --ev:#f5a13a; --cmd:#5aa0e6; --act:#f7e36b; --pol:#c79ae3; --rm:#8fd18f; --hot:#e8503f;
  --shadow:0 2px 0 rgba(0,0,0,.08),0 6px 14px rgba(0,0,0,.10);
  --done:var(--rm); --active:var(--ev); --todo:var(--line);
}
:root{color-scheme:light dark}
:root[data-theme="light"]{color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1b1a17;--board:#23221e;--ink:#ece8dd;--muted:#a39d8f;--line:#3a3831;--panel:#2b2a25;--shadow:0 2px 0 rgba(0,0,0,.3),0 8px 18px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1b1a17;--board:#23221e;--ink:#ece8dd;--muted:#a39d8f;--line:#3a3831;--panel:#2b2a25;--shadow:0 2px 0 rgba(0,0,0,.3),0 8px 18px rgba(0,0,0,.4)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.4}
header{padding:16px 20px 8px;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline}
h1{margin:0;font-size:24px;font-weight:700}
header .meta{color:var(--muted)}
header nav{margin-left:auto;display:flex;gap:14px;font-size:14px;align-items:baseline}
header nav a{color:var(--ink)}
header nav .conn{color:var(--muted);font-size:13px}
header nav .conn b{color:var(--ink);font-weight:600}
main{padding:0 20px 28px;max-width:1200px}
code{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:var(--bg);padding:2px 6px;border-radius:3px}

/* aktualny krok */
.next{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--active);border-radius:6px;padding:16px 18px;margin:8px 0 18px;box-shadow:var(--shadow);display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center}
.next.alldone{border-left-color:var(--done)}
.next .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.next h2{margin:2px 0 4px;font-size:20px}
.next p{margin:0;color:var(--muted);max-width:60ch}
.next>div:first-child{flex:1 1 380px;min-width:0}
.next .cmd{margin-left:auto;display:flex;flex-direction:column;gap:6px;align-self:center}
.next .cmdrow{display:flex;gap:8px;align-items:center}
.run{font-size:12px;color:var(--muted)}
.howto{margin-top:10px}
.howto .hl{font-size:12px;font-weight:600;color:var(--ink);margin-bottom:2px}
.howto ol{margin:0;padding-left:20px;max-width:70ch;font-size:14px;display:flex;flex-direction:column;gap:2px}
.next .cmd code{font-size:16px;padding:8px 12px;background:var(--bg);border:1px solid var(--line)}
button.b{font:inherit;font-size:13px;padding:7px 12px;border-radius:4px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}

/* os etapow */
.steps{list-style:none;margin:0 0 18px;padding:0;display:grid;grid-template-columns:repeat(6,1fr);gap:0}
.steps li{position:relative;text-align:center;padding-top:34px;font-size:13.5px;color:var(--muted)}
.steps li::before{content:"";position:absolute;top:14px;left:0;right:0;height:3px;background:var(--line)}
.steps li:first-child::before{left:50%}.steps li:last-child::before{right:50%}
.steps li.done::before{background:var(--done)}
.steps .dot{position:absolute;top:2px;left:50%;transform:translateX(-50%);width:28px;height:28px;border-radius:50%;background:var(--panel);border:3px solid var(--todo);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted)}
.steps li.done .dot{background:var(--done);border-color:var(--done);color:#26241f}
.steps li.partial .dot{background:var(--act);border-color:var(--act)}
.steps li.active .dot{border-color:var(--active);color:var(--ink)}
.steps li.current .dot{box-shadow:0 0 0 4px color-mix(in srgb,var(--active) 35%,transparent)}
.steps li.current{color:var(--ink);font-weight:600}

/* karty */
.wrap{display:grid;grid-template-columns:1fr 320px;gap:16px}
/* jedna kolumna, karta zwijana; rozwinieta domyslnie tylko aktualna (zmiana 0.10.0) */
.cards{display:flex;flex-direction:column;gap:8px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:0}
.card.current{outline:2px solid var(--active);outline-offset:-1px}
.card>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:12px 14px;font-size:16px;font-weight:600;min-width:0}
.card>summary::-webkit-details-marker{display:none}
.card>summary:focus-visible{outline:2px solid var(--ink);outline-offset:-2px;border-radius:6px}
.card .chev{color:var(--muted);font-size:14px;width:12px;transition:transform .15s}
.card[open] .chev{transform:rotate(90deg)}
.card .n{color:var(--muted);font-weight:500;font-size:13px}
.card .sumline{flex:1;min-width:0;font-size:12.5px;font-weight:400;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .sumline b{color:var(--ink)}
.card[open] .sumline{visibility:hidden}
.card .body{display:flex;flex-direction:column;gap:8px;padding:0 14px 14px}
.steps li{cursor:pointer}
.pill{margin-left:auto;flex:none;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:10px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.pill.done{background:var(--done);border-color:var(--done);color:#26241f}
.pill.active{background:var(--active);border-color:var(--active);color:#26241f}
/* gotowe, ale z pytaniami do wyjasnienia (zmiana 0.10.1) */
.pill.partial{background:var(--act);border-color:var(--act);color:#26241f}
.card p{margin:0;color:var(--muted);font-size:13.5px}
.counts{display:flex;flex-wrap:wrap;gap:6px 14px;margin:2px 0 0;padding:0;list-style:none;font-size:13px;color:var(--muted)}
.counts b{color:var(--ink);font-size:15px;font-variant-numeric:tabular-nums}
.counts .warn b{color:var(--hot)}
.card .foot{margin-top:auto;padding-top:6px}

/* panele */
aside{display:flex;flex-direction:column;gap:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px}
.panel h2{margin:0 0 8px;font-size:15px}
.panel ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.panel .empty{color:var(--muted);font-size:13.5px;margin:0}
.panel .id{font-weight:700;margin-right:4px}
.panel .why{color:var(--muted);font-size:12px}
.panel.block{border-top:4px solid var(--hot)}
.log li{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--muted);word-break:break-word}

button.b.p{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.b:disabled{opacity:.45;cursor:not-allowed}
dialog{border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);padding:20px;width:min(460px,calc(100vw - 32px));box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog h2{margin:0 0 4px;font-size:18px}
dialog .hint{margin:0 0 12px;color:var(--muted);font-size:13px}
dialog label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
dialog label small{display:block;font-weight:400;color:var(--muted)}
dialog input,dialog select{width:100%;font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink)}
dialog .row{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
dialog .err{color:var(--hot);font-size:13px;min-height:1.2em;margin:8px 0 0}
/* zalaczniki */
.drop{border:2px dashed var(--line);border-radius:6px;padding:10px;text-align:center;font-size:13px;color:var(--muted);cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--active);background:color-mix(in srgb,var(--active) 10%,transparent);color:var(--ink)}
.drop b{color:var(--ink)}
.uplog{margin:0;padding:0;list-style:none;font-size:12.5px;display:flex;flex-direction:column;gap:2px}
.uplog .ok{color:var(--muted)}.uplog .ok::before{content:"✓ ";color:var(--ink)}
.uplog .bad{color:var(--hot)}
.uplog .sum{color:var(--ink);font-weight:600}
.uplog .dup{color:var(--muted)}.uplog .dup::before{content:"= ";color:var(--ink)}
.nofiles{margin:0;font-size:12.5px;color:var(--muted)}
.files{font-size:13px;border-top:1px solid var(--line);padding-top:6px}
.files summary{cursor:pointer;color:var(--muted)}
.files summary b{color:var(--ink)}
.files ul{list-style:none;margin:6px 0 0;padding:0;max-height:260px;overflow-y:auto;display:flex;flex-direction:column;gap:3px}
.files li{display:flex;gap:8px;align-items:baseline;font-size:12.5px}
.files .fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:ui-monospace,Menlo,monospace}
.files .fs{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.files .tag{font-size:11px;padding:0 6px;border-radius:8px;white-space:nowrap;background:var(--active);color:#26241f}
.files .tag.ok{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.files .rm{background:none;border:1px solid transparent;border-radius:3px;color:var(--muted);cursor:pointer;font:inherit;font-size:12px;line-height:1;padding:2px 5px}
.files .rm-none{width:22px;flex:none}
.files .rmhint{margin:6px 0 0;font-size:12px;color:var(--muted)}
.files .rm:hover,.files .rm:focus-visible{border-color:var(--line);color:var(--hot)}
.qs li{display:grid;grid-template-columns:auto 1fr auto;gap:2px 8px;align-items:baseline;padding:3px 0;border-bottom:1px solid var(--line)}
.qs li:last-child{border-bottom:0}
.qs .qid{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--muted)}
.qs .qt{min-width:0;overflow-wrap:anywhere}
.qs .qm{grid-column:2 / 4;font-size:11.5px;color:var(--muted);overflow-wrap:anywhere}
.qs .tag.bad{background:var(--hot);color:#fff}
.qs .tag.ask{background:var(--cmd);color:#26241f}
.qs .qf{display:flex;gap:4px;margin:6px 0 2px}
.qs .qf button{font:inherit;font-size:12px;padding:2px 8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--muted);cursor:pointer}
.qs .qf button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.missing{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:24px;max-width:640px}
.missing h2{margin-top:0}
.missing label{display:block;font-size:13px;font-weight:600;margin:16px 0 4px}
.missing input{width:100%;font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink)}
.missing .row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.missing .err{color:var(--hot);font-size:13px;min-height:1.2em;margin:8px 0 0}
.missing .hint{color:var(--muted);font-size:13px}
.missing .pick{display:flex;gap:8px}
.missing .pick input{flex:1;min-width:0}
#browse .cur{font:12px ui-monospace,monospace;word-break:break-all;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:6px 8px;margin:8px 0}
#browse ul{list-style:none;margin:0;padding:0;max-height:min(360px,50vh);overflow:auto;border:1px solid var(--line);border-radius:4px}
#browse li button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;font:inherit;background:none;border:0;border-bottom:1px solid var(--line);padding:7px 10px;color:var(--ink);cursor:pointer}
#browse li:last-child button{border-bottom:0}
#browse li button:hover:not(:disabled),#browse li button:focus-visible{background:var(--bg)}
#browse li button:disabled{color:var(--muted);cursor:not-allowed}
#browse .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#browse .tg{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 5px}
#browse .empty{color:var(--muted);font-size:13px;padding:10px}
@media(max-width:900px){.wrap{grid-template-columns:1fr}}
@media(max-width:640px){
  header,main{padding-left:16px;padding-right:16px}
  header nav{margin-left:0;width:100%;flex-wrap:wrap;gap:8px 14px}
  .steps{grid-template-columns:1fr;gap:6px}
  .steps li{text-align:left;padding:4px 0 4px 40px;min-height:30px}
  .steps li::before{display:none}
  .steps .dot{left:0;transform:none;top:2px;width:26px;height:26px}
  .next .cmd{margin-left:0}
}
</style>
</head>
<body>
<nav class="topbar" id="topbar" data-page="panel" aria-label="Widok"></nav>
<header>
  <h1><span class="lbl">Wymagania do modułu:</span> <span class="modsw">
    <button type="button" id="modbtn" aria-haspopup="true" aria-expanded="false" aria-controls="modmenu" title="Przełącz moduł albo załóż nowy"><span class="mname" id="title">…</span><span class="car" aria-hidden="true">▾</span></button>
    <div id="modmenu" class="modmenu" role="menu" hidden></div>
  </span></h1>
  <span class="meta" id="meta"></span>
  <nav>
    <span class="conn">na żywo: <b id="conn">…</b></span>
  </nav>
</header>
<main id="app"></main>
<input type="file" id="files" multiple hidden>
<dialog id="browse" aria-labelledby="browseh">
  <h2 id="browseh">Wybierz katalog modułów</h2>
  <p class="hint">Wskaż katalog do przechowywania danych - powinien być poza katalogiem sdd-kit.</p>
  <div class="cur" id="browsecur"></div>
  <ul id="browselist"></ul>
  <p class="err" id="browseerr"></p>
  <div class="row">
    <button class="b" type="button" id="browsecancel">Anuluj</button>
    <button class="b p" type="button" id="browseok">Wybierz ten folder</button>
  </div>
</dialog>
<dialog id="dlg">
  <form id="modform" method="dialog">
    <h2>Nowy moduł</h2>
    <p class="hint">Założę folder w katalogu modułów (<span id="rootdir"></span>) z pustą strukturą wymagań, tak jak <code>/sdd:init</code>.</p>
    <label>Nazwa modułu <small>małe litery, cyfry i myślnik, np. faktury-2026</small>
      <input name="name" required pattern="[a-z0-9][a-z0-9\-]{0,63}" autocomplete="off"></label>
    <label>Poziom
      <select name="level">
        <option value="full">pełny: dokument PRD dla biznesu + pliki dla programistów</option>
        <option value="light">lekki: jeden krótki SPEC.md, do małych rzeczy</option>
      </select></label>
    <label>Kto akceptuje wymagania, decyzje i słownik pojęć? <small>rola, nie osoba, np. właściciel procesu, kierownik działu</small>
      <input name="approver" value="właściciel procesu"></label>
    <label>Kto zatwierdza cały dokument na koniec? <small>opcjonalnie, np. sponsor, zarząd; puste = ta sama osoba co wyżej</small>
      <input name="sponsor" value="sponsor biznesowy"></label>
    <p class="err" id="moderr"></p>
    <div class="row">
      <button class="b" type="button" id="modcancel">Anuluj</button>
      <button class="b p" type="submit">Załóż moduł</button>
    </div>
  </form>
</dialog>
<script>
  var BASE=SddUI.base(location.pathname); // '' albo /demo (zmiana 0.12.0)
(function(){
  var $=function(s){return document.querySelector(s)};
  var STATUS={done:'gotowe',active:'w toku',todo:'nie zaczęte'};
  var LEVEL={full:'pełny',light:'lekki'};
  // etykiety licznikow: [klucz, etykieta, czy ostrzezenie gdy > 0]
  var LABELS={
    intake:[['sources','źródeł w spisie'],['unindexed','czeka na spis',1]],
    interview:[['questions','pytań'],['open','otwarte'],['asked','zadane biznesowi'],['conflicting','sprzeczne',1],['decisions','decyzji'],['unconfirmed','założeń niepotw.'],['refuted','obalonych',1]],
    domain:[['terms','haseł'],['approved','zatwierdzonych'],['actors','ról'],['entities','encji'],['rules','reguł']],
    spec:[['requirements','wymagań'],['approved','zatwierdzonych'],['review','do przeglądu']],
    validate:[['readiness','% gotowości'],['reports','raportów']],
    handover:[['traceability','tabela śledzenia'],['backlogs','backlogów']]
  };
  var last=null, uplog=[];
  function api(url,opts){
    opts=opts||{}; opts.headers=Object.assign({'X-SDD':'1'},opts.headers||{});
    return fetch(BASE+url,opts).then(function(r){return r.json().catch(function(){return {}}).then(function(j){if(!r.ok) throw new Error(j.error||(r.status===404?'Serwer jest starszy niż strona - zatrzymaj go (Ctrl+C) i uruchom ponownie.':'HTTP '+r.status)); return j})});
  }
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

  // Stan kart (zmiana 0.10.0): wybor usera per etap; aktualny krok rozwija sie po zmianie.
  var cardToggled={}, lastCurrent=null;
  // Jedna linia licznikow w naglowku zwinietej karty.
  function pill(s){
    if(s.status==='done'&&s.partial) return '<span class="pill partial" title="Etap nie blokuje dalszej pracy, ale zostały pytania">gotowe · '+s.partial+' do wyjaśnienia</span>';
    return '<span class="pill '+s.status+'">'+STATUS[s.status]+'</span>';
  }
  function sumline(st){
    return (LABELS[st.key]||[]).map(function(l){
      var v=st.counts[l[0]];
      if(v===null||v===undefined) return '';
      if(typeof v==='boolean') return esc(l[1])+': <b>'+(v?'jest':'brak')+'</b>';
      return '<b>'+esc(v)+'</b> '+esc(l[1]);
    }).filter(Boolean).slice(0,3).join(' · ');
  }
  function counts(st){
    return (LABELS[st.key]||[]).map(function(l){
      var v=st.counts[l[0]];
      if(v===null||v===undefined) return '';
      if(typeof v==='boolean') return '<li>'+esc(l[1])+': <b>'+(v?'jest':'brak')+'</b></li>';
      var warn=l[2]&&typeof v==='number'&&v>0;
      return '<li'+(warn?' class="warn"':'')+'><b>'+esc(v)+'</b> '+esc(l[1])+'</li>';
    }).join('');
  }

  var askRoot=location.hash==='#katalog';
  if(askRoot) history.replaceState(null,'',location.pathname);
  function rootScreen(p){
    $('#meta').textContent='';
    var cancel=!p.needsRoot;
    $('#app').innerHTML='<div class="missing"><h2>Gdzie trzymać wymagania?</h2>'+
      '<p>Wskaż katalog do przechowywania danych - powinien być poza katalogiem sdd-kit.</p>'+
      '<form id="rootform"><label for="rootpath">Katalog modułów</label>'+
      '<div class="pick"><input id="rootpath" name="path" required autocomplete="off" placeholder="~/wymagania" value="'+esc(p.modulesRoot||'')+'">'+
      '<button class="b" type="button" id="rootbrowse">Przeglądaj…</button></div>'+
      '<p class="hint">np. <code>~/wymagania</code> · sdd-kit: '+esc(p.kitDir||'')+'</p>'+
      '<p class="err" id="rooterr"></p><div class="row">'+(cancel?'<button class="b" type="button" id="rootcancel">Anuluj</button>':'')+
      '<button class="b p" type="submit">Zapisz</button></div></form></div>';
    var f=$('#rootform'); f.elements.path.focus();
    if(cancel) $('#rootcancel').onclick=function(){ askRoot=false; render(last); };
    $('#rootbrowse').onclick=function(){ browse(f.elements.path.value, true); $('#browse').showModal(); };
    f.onsubmit=function(e){
      e.preventDefault();
      api('/api/root',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:f.elements.path.value})})
        .then(function(){ askRoot=false; if(last) render(last); })
        .catch(function(err){ $('#rooterr').textContent=err.message; });
    };
  }
  // Okno "Przeglądaj…": serwer listuje podfoldery, panel tylko pokazuje (przegladarka nie zna sciezek dysku).
  var browsing=null;
  function browse(dir, fallback){
    $('#browseerr').textContent='';
    api('/api/dirs?path='+encodeURIComponent(dir||'')).then(function(d){
      browsing=d;
      $('#browsecur').textContent=d.path;
      $('#browseok').disabled=d.inKit;
      $('#browseerr').textContent=d.inKit?'To folder aplikacji sdd-kit - wybierz folder poza nim.':'';
      var h=d.parent?'<li><button type="button" data-dir="'+esc(d.parent)+'"><span class="nm">↑ wyżej</span></button></li>':'';
      h+=d.dirs.map(function(x){
        return '<li><button type="button" data-dir="'+esc(x.path)+'"'+(x.kit?' disabled':'')+'><span class="nm">📁 '+esc(x.name)+'</span>'+
          (x.kit?'<span class="tg">aplikacja</span>':x.module?'<span class="tg">moduł</span>':'')+'</button></li>';
      }).join('');
      if(!d.dirs.length) h+='<li class="empty">Brak podfolderów.</li>';
      $('#browselist').innerHTML=h;
      var first=$('#browselist button:not(:disabled)'); if(first) first.focus();
    }).catch(function(e){
      if(fallback&&dir) return browse('', false); // nieistniejaca sciezka z pola -> katalog domowy
      $('#browseerr').textContent=e.message;
    });
  }
  $('#browselist').onclick=function(e){ var b=e.target.closest('button'); if(b&&!b.disabled) browse(b.getAttribute('data-dir')); };
  $('#browsecancel').onclick=function(){ $('#browse').close(); };
  $('#browseok').onclick=function(){
    if(!browsing||browsing.inKit) return;
    var i=$('#rootpath'); if(i){ i.value=browsing.path; i.focus(); }
    $('#browse').close();
  };

  function render(p){
    var app=$('#app');
    // ekran juz stoi - nie kasuj tego, co user wpisuje, przy kazdym odswiezeniu z serwera
    if(p.needsRoot||askRoot){ renderModules(p); if(!$('#rootform')) rootScreen(p); return; }
    if(!p.module){
      $('#meta').textContent='';
      renderModules(p);
      app.innerHTML='<div class="missing"><h2>Brak modułów</h2>'+
        '<p>W katalogu <code>'+esc(p.modulesRoot)+'</code> nie ma jeszcze żadnego modułu.</p>'+
        '<div class="row"><button class="b" type="button" id="chroot2">Zmień katalog</button><button class="b p" type="button" id="newmod2">Nowy moduł…</button></div></div>';
      $('#chroot2').onclick=function(){ askRoot=true; render(p); };
      $('#newmod2').onclick=openNew;
      return;
    }
    if(!p.exists){
      $('#meta').textContent='';
      renderModules(p);
      app.innerHTML='<div class="missing"><h2>Brak folderu requirements/</h2>'+
        '<p>Serwer patrzy na: <code>'+esc(p.dir)+'</code></p>'+
        '<p>Uruchom <code>sdd-board</code> w folderze projektu albo załóż strukturę w Claude Code: <code>/sdd:init</code>. Strona odświeży się sama.</p></div>';
      return;
    }
    renderModules(p);
    $('#meta').textContent='poziom '+(LEVEL[p.level]||p.level)+' · '+p.stages.filter(function(s){return s.status==='done'}).length+' z 6 etapów gotowych';
    document.title=(p.project||'SDD')+' · postęp';

    var allDone=p.next.key==='done';
    var html='<section class="next'+(allDone?' alldone':'')+'"><div><div class="lbl">'+(allDone?'Status':'Aktualny krok')+'</div>'+
      '<h2>'+esc(p.next.name)+'</h2><p>'+esc(p.next.desc)+'</p>'+
      ((p.next.howto||[]).length?'<div class="howto"><div class="hl">Co zrobić</div><ol>'+p.next.howto.map(function(h){return '<li>'+esc(h)+'</li>'}).join('')+'</ol></div>':'')+'</div>'+
      '<div class="cmd"><div class="run">Uruchom w Claude Code:</div><div class="cmdrow"><code id="nextcmd">'+esc(p.next.command)+'</code><button class="b" id="copy">Kopiuj</button></div></div></section>';

    html+='<ol class="steps">'+p.stages.map(function(s,i){
      var cur=s.key===p.next.key?' current':'';
      return '<li class="'+s.status+(s.partial?' partial':'')+cur+'" data-key="'+s.key+'" title="'+(s.partial?'Gotowe, '+s.partial+' do wyjaśnienia':'Pokaż kartę etapu')+'"><span class="dot">'+(s.status==='done'?'✓':i+1)+'</span>'+esc(s.name)+'</li>';
    }).join('')+'</ol>';

    if(p.next.key!==lastCurrent){ delete cardToggled[p.next.key]; lastCurrent=p.next.key; }
    html+='<div class="wrap"><div class="cards">'+p.stages.map(function(s,i){
      var cur=s.key===p.next.key?' current':'';
      var open=SddUI.cardOpen(s.key,p.next.key,cardToggled);
      return '<details class="card'+cur+'" data-key="'+s.key+'"'+(open?' open':'')+'><summary>'+
        '<span class="chev" aria-hidden="true">›</span><span class="n">'+(i+1)+'</span><span>'+esc(s.name)+'</span>'+
        '<span class="sumline">'+sumline(s)+'</span>'+
        pill(s)+'</summary><div class="body">'+
        '<p>'+esc(s.desc)+'</p><ul class="counts">'+counts(s)+'</ul>'+
        (s.key==='intake'?intakeBox(s.files||[]):'')+
        (s.key==='interview'?questionBox(s.questions||[]):'')+
        '<div class="foot"><span class="run">Uruchom w Claude Code:</span> <code>'+esc(s.command)+'</code></div></div></details>';
    }).join('')+'</div><aside>';

    html+='<section class="panel block"><h2>Blokuje dev</h2>'+(p.blockers.length?
      '<ul>'+p.blockers.map(function(b){return '<li><span class="id">'+esc(b.id)+'</span>'+esc(b.text)+' <span class="why">('+esc(b.reason)+')</span></li>'}).join('')+'</ul>'
      :'<p class="empty">Nic nie blokuje.</p>')+'</section>';

    html+='<section class="panel"><h2>Czeka na biznes</h2>'+(p.waiting.length?
      '<ul>'+p.waiting.map(function(w){return '<li><b>'+esc(w.role)+'</b>: '+w.count+' '+(w.count===1?'pytanie':'pytań')+' <span class="why">'+esc(w.ids.join(', '))+'</span></li>'}).join('')+'</ul>'
      :'<p class="empty">Brak pytań u biznesu.</p>')+'</section>';

    html+='<section class="panel"><h2>Ostatnie zmiany</h2>'+(p.changelog.length?
      '<ul class="log">'+p.changelog.map(function(l){return '<li>'+esc(l)+'</li>'}).join('')+'</ul>'
      :'<p class="empty">Brak wpisów.</p>')+'</section>';

    html+='</aside></div>';
    app.innerHTML=html;
    wireDrop();
    [].forEach.call(document.querySelectorAll('.card>summary'),function(sm){
      sm.onclick=function(){ var d=sm.parentNode; cardToggled[d.getAttribute('data-key')]=!d.open; };
    });
    [].forEach.call(document.querySelectorAll('.steps li'),function(li){
      li.onclick=function(){
        var k=li.getAttribute('data-key'); cardToggled[k]=true; render(last);
        var d=document.querySelector('.card[data-key="'+k+'"]'); if(d) d.scrollIntoView({behavior:'smooth',block:'start'});
      };
    });
    var ql=$('#qlist'); if(ql){
      ql.querySelector('summary').onclick=function(){qOpen=!ql.open};
      ql.querySelector('.qf').onclick=function(e){ var b=e.target.closest('[data-qf]'); if(!b) return; qFilter=b.getAttribute('data-qf'); qOpen=true; render(last); };
    }
    var fl=$('#filelist'); if(fl){
      fl.querySelector('summary').onclick=function(){filesOpen=!fl.open};
      fl.querySelector('ul').onclick=function(e){ var b=e.target.closest('.rm'); if(b) removeFile(b.getAttribute('data-name')); };
    }
    var btn=$('#copy');
    btn.onclick=function(){
      try{navigator.clipboard.writeText(p.next.command).then(function(){btn.textContent='Skopiowano'})}catch(e){}
    };
  }

  var shownModule=null;
  var setModule=SddUI.modSwitch({
    onSelect:function(){ uplog=[]; },
    onNew:function(){ openNew(); },
    onRoot:function(){ askRoot=true; if(last) render(last); }
  });
  function openNew(){ $('#moderr').textContent=''; $('#dlg').showModal(); $('#modform').elements['name'].focus(); }
  function renderModules(p){
    last=p;
    var cur=p.module?p.module.name:'';
    if(shownModule!==null&&shownModule!==cur){ uplog=[]; filesOpen=null; qOpen=null; cardToggled={}; lastCurrent=null; }
    shownModule=cur;
    setModule(cur,p.modules,p.demo);
    $('#rootdir').textContent=p.modulesRoot||'';
  }
  function size(b){return b<1024?b+' B':b<1048576?Math.round(b/1024)+' KB':(b/1048576).toFixed(1)+' MB'}
  var filesOpen=null, qOpen=null;
  // Pytania do wyjasnienia (zmiana 0.9.0): widac, do czego wracac, choc nie cofaja aktualnego kroku.
  var QTAG={conflicting:['bad','sprzeczne'],asked:['ask','zadane'],open:['','otwarte'],answered:['ok','odpowiedziane'],parked:['ok','zaparkowane']};
  var qFilter='pending'; // 'pending' | 'all' - pamietane do przeladowania strony
  function questionBox(qs){
    var pend=qs.filter(function(q){return q.pending});
    if(!qs.length) return '<p class="nofiles">Nie ma jeszcze pytań.</p>';
    var shown=qFilter==='all'?qs:pend;
    var open=qOpen===null?pend.length<=8:qOpen;
    var h='<details class="files qs" id="qlist"'+(open?' open':'')+'><summary>Pytania do wyjaśnienia: <b>'+pend.length+'</b> z '+qs.length+'</summary>'+
      '<div class="qf" role="group" aria-label="Filtr pytań">'+
      '<button type="button" data-qf="pending" aria-pressed="'+(qFilter!=='all')+'">Do wyjaśnienia ('+pend.length+')</button>'+
      '<button type="button" data-qf="all" aria-pressed="'+(qFilter==='all')+'">Wszystkie ('+qs.length+')</button></div>';
    if(!shown.length) return h+'<p class="nofiles">Nie ma pytań do wyjaśnienia.</p></details>';
    return h+'<ul>'+shown.map(function(q){
        var t=q.blocking&&q.kind!=='conflicting'?['bad','blokuje']:(QTAG[q.kind]||['',q.status||q.kind]);
        var meta=[q.role&&('do: '+q.role),q.source&&('skąd: '+q.source)];
        if(q.kind==='answered'&&q.closedBy) meta.unshift('zamknięte: '+q.closedBy);
        if(q.kind==='parked') meta.unshift(q.status);
        return '<li><span class="qid">'+esc(q.id)+'</span><span class="qt">'+esc(q.text)+'</span><span class="tag '+t[0]+'">'+esc(t[1])+'</span>'+
          '<span class="qm">'+esc(meta.filter(Boolean).join(' · '))+'</span></li>';
      }).join('')+'</ul><p class="rmhint">Wracasz do nich przez <code>/sdd:interview</code> (live albo async). Blokują tylko sprzeczne i oznaczone jako blokujące.</p></details>';
  }
  function intakeBox(files){
    var h='<div class="drop" id="drop" role="button" tabindex="0"><b>Dołącz pliki</b> albo upuść je tutaj<br>maile, notatki, PDF, zrzuty · do 25 MB</div>';
    if(uplog.length) h+='<ul class="uplog">'+uplog.map(function(l){return '<li class="'+l.cls+'">'+esc(l.text)+'</li>'}).join('')+'</ul>';
    if(!files.length) return h+'<p class="nofiles">Nie ma jeszcze żadnych plików.</p>';
    var open=filesOpen===null?files.length<=8:filesOpen;
    return h+'<details class="files" id="filelist"'+(open?' open':'')+'><summary>Wrzucone pliki: <b>'+files.length+'</b></summary><ul>'+
      files.map(function(f){return '<li><span class="fn" title="'+esc(f.name)+'">'+esc(f.name)+'</span><span class="fs">'+size(f.size)+'</span>'+
        '<span class="tag'+(f.indexed?' ok':'')+'">'+(f.indexed?'dodane':'czeka na spis')+'</span>'+
        (f.indexed?'<span class="rm-none" title="Plik jest już w spisie – nie można go usunąć"></span>':
          '<button type="button" class="rm" data-name="'+esc(f.name)+'" title="Usuń plik (czeka na spis)" aria-label="Usuń plik '+esc(f.name)+'">✕</button>')+'</li>'}).join('')+'</ul>'+
      '<p class="rmhint">✕ usuwa tylko pliki, które czekają na spis. Plików już zaindeksowanych („dodane”) nie można usunąć.</p></details>';
  }
  function wireDrop(){
    var d=$('#drop'); if(!d) return;
    d.onclick=function(){$('#files').click()};
    d.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();$('#files').click()}};
    d.ondragover=function(e){e.preventDefault();d.classList.add('over')};
    d.ondragleave=function(){d.classList.remove('over')};
    d.ondrop=function(e){e.preventDefault();d.classList.remove('over');upload(e.dataTransfer.files)};
  }
  function removeFile(name){
    if(!confirm('Usunąć plik „'+name+'”?\n\nPlik zostanie skasowany z dysku. Tego nie da się cofnąć.')) return;
    api('/api/intake?name='+encodeURIComponent(name),{method:'DELETE'})
      .then(function(){ uplog=[{cls:'dup',text:'usunięto '+name}]; if(last) render(last); })
      .catch(function(e){ uplog=[{cls:'bad',text:name+': '+e.message}]; if(last) render(last); });
  }
  function upload(list){
    var files=[].slice.call(list||[]); if(!files.length) return;
    var ok=[], dup=[], bad=[];
    function show(done){
      var many=files.length>3, l=[];
      var head=(done?'':'wysyłam '+(ok.length+dup.length+bad.length)+' z '+files.length+' · ')+'zapisano '+ok.length+
        (dup.length?', pominięto '+dup.length+' (już są)':'')+(bad.length?', błędy: '+bad.length:'');
      if(files.length>1||!done) l.push({cls:'sum',text:head});
      if(!many) ok.forEach(function(t){l.push({cls:'ok',text:'zapisano '+t+' → 00-intake/'})});
      dup.forEach(function(t){l.push({cls:'dup',text:t})});
      bad.forEach(function(t){l.push({cls:'bad',text:t})});
      uplog=l; if(last) render(last);
    }
    (function next(i){
      if(i>=files.length) return show(true);
      var f=files[i];
      if(f.size>25*1024*1024){ bad.push(f.name+': większy niż 25 MB'); return next(i+1); }
      api('/api/intake?name='+encodeURIComponent(f.name),{method:'POST',body:f})
        .then(function(j){ if(j.saved) ok.push(j.saved); else dup.push(f.name+': taki sam plik już jest jako '+j.duplicate); })
        .catch(function(e){ bad.push(f.name+': '+e.message); })
        .then(function(){ show(false); next(i+1); });
    })(0);
  }
  $('#files').onchange=function(e){upload(e.target.files); e.target.value='';};
  $('#modcancel').onclick=function(){ $('#dlg').close(); };
  $('#modform').onsubmit=function(e){
    e.preventDefault();
    var f=e.target, el=f.elements, body={name:el['name'].value.trim(),level:el.level.value,approver:el.approver.value.trim(),sponsor:el.sponsor.value.trim()};
    api('/api/modules',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
      .then(function(){ uplog=[]; f.reset(); $('#dlg').close(); })
      .catch(function(err){ $('#moderr').textContent=err.message; });
  };

  if(location.hash==='#nowy-modul'){ history.replaceState(null,'',location.pathname); $('#moderr').textContent=''; $('#dlg').showModal(); $('#modform').elements['name'].focus(); }

  function connect(){
    var es=new EventSource(BASE+'/progress-events');
    es.onopen=function(){$('#conn').textContent='połączono'};
    es.onmessage=function(e){render(JSON.parse(e.data))};
    es.onerror=function(){$('#conn').textContent='rozłączono, ponawiam…'};
  }
  connect();
})();
</script>
</body>
</html>

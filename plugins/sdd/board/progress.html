<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SDD</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/ui.css">
<script src="/ui.js"></script>
<style>
/* Panel modulu (0.34.0, design_handoff_sdd_kit_ui 2, docs/specs/ui-frame.md AC-F3..F5). Tokeny, rama i karta - ui.css. */
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.45}
main{max-width:880px;padding:16px;display:flex;flex-direction:column;gap:12px}
code{font-family:var(--mono);font-size:11.5px;background:var(--bg);border:1px solid var(--line);border-radius:2px;padding:1px 4px;overflow-wrap:anywhere}

/* 2.1 aktualny krok */
.next .nx{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;padding:14px 16px}
.next .nl{flex:1 1 320px;min-width:0}
.next .nh{display:flex;align-items:center;gap:8px}
.next .badge{font:600 10.5px/1 var(--mono);letter-spacing:.08em;background:var(--accent);color:#1d1b16;padding:3px 5px;border-radius:2px}
.next .pos{font:11px var(--mono);color:var(--muted)}
.next h2{margin:6px 0 4px;font-size:20px;font-weight:600;letter-spacing:-.01em;line-height:1.25}
.next p{margin:0;color:var(--muted);font-size:13px;line-height:1.45;max-width:62ch}
.next .nr{display:flex;flex-direction:column;gap:4px;min-width:0}
.run{font:10.5px var(--mono);color:var(--faint)}
.cmdf{display:flex;align-items:stretch;height:32px;border:1px solid var(--input-line);border-radius:3px;background:var(--input);overflow:hidden;max-width:100%}
.cmdf code{display:flex;align-items:center;border:0;border-radius:0;background:none;padding:0 10px;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmdf code::before{content:"› ";color:var(--accent);white-space:pre}
.cmdf button{flex:none;border:0;border-left:1px solid var(--input-line);background:var(--ink);color:var(--bg);font:600 12px/1 var(--sans);padding:0 12px;cursor:pointer}
.cmdf button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.how{list-style:none;margin:0;padding:10px 16px 12px;border-top:1px solid var(--line-soft);display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px 18px;font-size:12.5px;line-height:1.45}
.how li{display:flex;gap:8px}
.how .hn{font:11px/1.6 var(--mono);color:var(--faint);flex:none}

/* 2.2 pasek etapow */
.stbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));overflow:hidden}
.stbar button{position:relative;display:flex;flex-direction:column;gap:2px;align-items:flex-start;min-width:0;padding:11px 10px 8px;border:0;border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);margin:0 -1px -1px 0;background:none;color:var(--ink);font:13px/1.3 var(--sans);text-align:left;cursor:pointer}
.stbar button::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--line)}
.stbar button.done::before{background:#5bb86a}
.stbar button.partial::before{background:#e0c040}
.stbar button.active::before{background:#e39a3b}
.stbar button.stale::before{background:repeating-linear-gradient(90deg,#e39a3b 0 6px,transparent 6px 10px)}
.stbar button.current{background:var(--cur-row);font-weight:700}
.stbar button:hover{background:var(--hover)}
.stbar button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.stbar .sn{font:10.5px var(--mono);color:var(--faint);font-weight:400}
.stbar .ss{font:10.5px var(--mono);color:var(--muted);font-weight:400;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 2.3 lista etapow (akordeon) */
.acc>.row{border-top:1px solid var(--line-soft)}
.acc>.row:first-child{border-top:0}
.acc>.row.current{background:var(--cur-row)}
.acc .rh{display:grid;grid-template-columns:12px 22px 84px minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;height:38px;padding:0 12px;border:0;background:none;color:var(--ink);font:13px var(--sans);text-align:left;cursor:pointer}
.acc .rh:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.acc .chev{font-size:11px;color:var(--faint)}
.acc .n{font:11px var(--mono);color:var(--muted)}
.acc .nm{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc .sum{min-width:0;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc .sum span+span{margin-left:14px}
.acc .sum b{font:600 12px var(--mono);color:var(--ink)}
.acc .sum .warn b{color:var(--hot-ink)}
.acc .row.open .sum{visibility:hidden}
.acc .body{display:flex;flex-direction:column;gap:10px;padding:0 12px 14px 54px}
.acc .desc{margin:0;font-size:12.5px;line-height:1.45;color:var(--muted)}
/* znacznik stanu: etapy, pozycje list */
.tag{display:inline-block;font:600 10.5px/1.2 var(--mono);padding:4px 6px;border-radius:2px;color:#1d1b16;background:var(--bg);white-space:nowrap}
.tag.done,.tag.ok{background:var(--st-done)}
.tag.partial{background:var(--st-part)}
.tag.active,.tag.work{background:var(--st-work)}
.tag.stale{background:transparent;border:1px solid var(--st-stale);color:var(--st-stale);padding:3px 5px}
.tag.todo{background:transparent;border:1px solid var(--line);color:var(--muted);padding:3px 5px}
.tag.bad{background:var(--hot-ink);color:#fff}
.tag.ask{background:var(--cmd)}
/* liczniki jako przyciski */
.counts{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.counts li>span,.counts .cbtn{display:inline-flex;align-items:baseline;gap:5px;padding:5px 9px;border:1px solid var(--line);border-radius:3px;background:var(--bg);font:12px var(--sans);color:var(--muted)}
.counts b{font:600 14px var(--mono);color:var(--ink)}
.counts .warn b{color:var(--hot-ink)}
.counts .cbtn{cursor:pointer}
.counts .cbtn::after{content:"▾";font-size:9px;color:var(--faint)}
.counts .cbtn:hover{border-color:var(--input-line)}
.counts .cbtn[aria-expanded="true"]{border-color:var(--ink);background:var(--input);box-shadow:inset 0 -2px 0 var(--ink)}
.counts .cbtn[aria-expanded="true"]::after{content:"▴"}
.counts .cbtn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
/* lista pod licznikiem, pliki intake, pytania */
.files{border:1px solid var(--line);border-radius:3px;background:var(--input);overflow:hidden}
.files .clh,.files>summary{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 10px;background:var(--bg);border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.files>summary{cursor:pointer;list-style:none}
.files>summary::-webkit-details-marker{display:none}
.files>summary::after{content:"▾";margin-left:auto;font-size:9px;color:var(--faint)}
.files[open]>summary::after{content:"▴"}
.files:not([open])>summary{border-bottom:0}
.files .clh b,.files>summary b{font:600 12.5px var(--mono);color:var(--ink)}
.files .clf code{font-size:11px;background:var(--panel)}
.files .clx{margin-left:auto;width:22px;height:22px;border:0;border-radius:3px;background:none;color:var(--muted);font-size:15px;line-height:1;cursor:pointer}
.files .clx:hover{background:var(--hover);color:var(--ink)}
.files ul{list-style:none;margin:0;padding:0;max-height:340px;overflow-y:auto}
.qs li{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:4px 10px;align-items:baseline;padding:10px;border-top:1px solid var(--line-soft)}
.qs li:first-child{border-top:0}
.qs .qid{font:600 11.5px var(--mono);color:var(--faint)}
.qs .qt{min-width:0;font-size:13px;line-height:1.55;color:var(--ink);text-wrap:pretty;overflow-wrap:anywhere}
.qs .qt .tag{margin-left:4px}
.qs .qm{grid-column:2 / 4;display:flex;flex-wrap:wrap;gap:2px 14px;font-size:11.5px;line-height:1.5;color:var(--muted)}
.qs .qm .ml{color:var(--faint)}
.qs .qm .src{font:11px var(--mono);overflow-wrap:anywhere}
.nofiles{margin:0;padding:10px;font-size:12.5px;color:var(--muted)}
.files>.nofiles{padding:10px}
.qs .qf{display:flex;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line-soft)}
.qs .qf button{font:12px var(--sans);height:24px;padding:0 9px;border-radius:3px;border:1px solid var(--line);background:none;color:var(--muted);cursor:pointer}
.qs .qf button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rmhint{margin:0;padding:8px 10px;border-top:1px solid var(--line-soft);font-size:11.5px;color:var(--muted)}
.qline{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;font-size:12.5px;color:var(--muted)}
.qline b{font:600 12.5px var(--mono);color:var(--ink)}
.qline a{font-weight:600;color:var(--ink)}
/* intake: strefa upuszczania i pliki */
.drop{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;border:1px dashed var(--dash);border-radius:3px;padding:10px 12px;font-size:12px;color:var(--muted);cursor:pointer}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--cur-row)}
.drop:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.drop b{font-weight:600;color:var(--ink)}
.drop .dn{margin-left:auto;font:11px var(--mono)}
.files li.f{display:flex;gap:8px;align-items:baseline;padding:6px 10px;border-top:1px solid var(--line-soft);font-size:12.5px}
.files li.f:first-child{border-top:0}
.files .fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:12px var(--mono)}
.files a.fn:hover,.files a.fn:focus-visible{text-decoration:underline}
.files .fs{font:11px var(--mono);color:var(--faint);white-space:nowrap}
.files .rm{background:none;border:1px solid transparent;border-radius:3px;color:var(--muted);cursor:pointer;font:inherit;font-size:12px;line-height:1;padding:2px 5px}
.files .rm-none{width:22px;flex:none}
.files .rm:hover,.files .rm:focus-visible{border-color:var(--line);color:var(--hot-ink)}
.uplog{margin:0;padding:0;list-style:none;font-size:12px;display:flex;flex-direction:column;gap:2px}
.uplog .ok{color:var(--muted)}.uplog .ok::before{content:"✓ ";color:var(--ok)}
.uplog .bad{color:var(--hot-ink)}
.uplog .sum{color:var(--ink);font-weight:600}
.uplog .dup{color:var(--muted)}.uplog .dup::before{content:"= ";color:var(--ink)}
.foot{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.foot .run{font-size:11px}
.foot code{font-size:12px;padding:4px 6px;border-radius:3px}

/* 2.4 karta boczna */
.side .sec{padding:10px 12px;border-top:1px solid var(--line-soft)}
.side .sec:first-child{border-top:0}
.side .sh{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:4px}
.side .cnt{font:600 11px var(--mono);color:var(--ok)}
.side .cnt.hot{color:var(--hot-ink)}
.side .empty{margin:0;font-size:12.5px;color:var(--muted)}
.side ul.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.side .id{font:600 11.5px var(--mono);color:var(--faint);margin-right:6px}
.side .why{color:var(--muted);font-size:11.5px}
.side .log{list-style:none;margin:0 -12px -10px;padding:0}
.side .log li{padding:8px 12px;border-top:1px solid var(--line-soft);display:flex;flex-direction:column;gap:2px}
.side .log .lh{display:flex;gap:8px;align-items:baseline}
.side .log .ld{font:10.5px var(--mono);color:var(--faint)}
.side .log .la{font:10.5px var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:2px;padding:0 4px;color:var(--muted)}
.side .log .lt{font:11.5px/1.5 var(--mono);color:var(--muted);overflow-wrap:anywhere}
.side .log .ls{font:10.5px var(--mono);color:var(--faint);overflow-wrap:anywhere}

/* 2.5 dialogi i ekrany startowe: karta jak 1.4, pola i przyciski jak 4.3 */
button.b{display:inline-flex;align-items:center;justify-content:center;height:30px;padding:0 10px;border:1px solid var(--input-line);border-radius:3px;background:transparent;color:var(--ink);font:600 12px/1 var(--sans);cursor:pointer;white-space:nowrap}
button.b:hover{border-color:var(--ink)}
button.b.p{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.b:disabled{opacity:.5;cursor:not-allowed}
button.b:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
dialog{border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink);padding:16px;width:min(460px,calc(100vw - 32px));box-shadow:var(--shadow);font-family:var(--sans)}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog h2,.missing h2{margin:0 0 4px;font-size:16px;font-weight:600}
dialog .hint,.missing .hint{margin:0 0 12px;color:var(--muted);font-size:12.5px}
dialog label,.missing label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
dialog label small{display:block;font-weight:400;font-size:11.5px;color:var(--muted)}
dialog input,dialog select,.missing input{width:100%;height:30px;padding:0 9px;border:1px solid var(--input-line);border-radius:3px;background:var(--input);color:var(--ink);font:13px var(--sans)}
dialog input:focus,dialog select:focus,.missing input:focus{outline:2px solid var(--accent);outline-offset:-1px}
dialog .row,.missing .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
dialog .err,.missing .err{color:var(--hot-ink);font-size:12px;font-weight:600;min-height:1.2em;margin:8px 0 0}
.missing{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:16px;max-width:640px}
.missing p{margin:0 0 8px}
.missing .pick{display:flex;gap:8px}
.missing .pick input{flex:1;min-width:0}
#browse .cur{font:12px var(--mono);word-break:break-all;background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:6px 8px;margin:8px 0}
#browse ul{list-style:none;margin:0;padding:0;max-height:min(360px,50vh);overflow:auto;border:1px solid var(--line);border-radius:3px;background:var(--input)}
#browse li button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;font:13px var(--sans);background:none;border:0;border-bottom:1px solid var(--line-soft);padding:7px 10px;color:var(--ink);cursor:pointer}
#browse li:last-child button{border-bottom:0}
#browse li button:hover:not(:disabled),#browse li button:focus-visible{background:var(--hover)}
#browse li button:disabled{color:var(--muted);cursor:not-allowed}
#browse .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#browse .tg{font:10.5px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:2px;padding:0 5px}
#browse .empty{color:var(--muted);font-size:12.5px;padding:10px}
@media(max-width:640px){
  main{padding:12px}
  .acc .rh{grid-template-columns:12px 22px minmax(0,1fr) auto}
  .acc .sum{display:none}
  .acc .body{padding-left:12px}
}
</style>
</head>
<body>
<div class="chrome">
<div class="statusbar">
  <span class="live" id="live"><i aria-hidden="true"></i><span>na żywo: <span id="conn">łączę…</span></span></span>
  <span class="meta" id="meta"></span>
  <span class="sright" id="sright"></span>
</div>
<nav class="topbar" id="topbar" data-page="panel" aria-label="Widok">
  <span class="modsw" data-slot="mod">
    <button type="button" id="modbtn" aria-haspopup="true" aria-expanded="false" aria-controls="modmenu" title="Przełącz moduł albo załóż nowy"><span class="mname" id="title">…</span><span class="car" aria-hidden="true">▾</span></button>
    <div id="modmenu" class="modmenu" role="menu" hidden></div>
  </span>
</nav>
</div>
<main id="app"></main>
<input type="file" id="files" multiple hidden>
<dialog id="browse" aria-labelledby="browseh">
  <h2 id="browseh">Wybierz katalog modułów</h2>
  <p class="hint" id="browsehint">Wskaż katalog do przechowywania danych - powinien być poza katalogiem sdd-kit.</p>
  <div class="cur" id="browsecur"></div>
  <ul id="browselist"></ul>
  <p class="err" id="browseerr"></p>
  <div class="row">
    <button class="b" type="button" id="browsecancel">Anuluj</button>
    <button class="b p" type="button" id="browseok">Wybierz ten folder</button>
  </div>
</dialog>
<dialog id="dlg">
  <form id="modform" method="dialog">
    <h2>Nowy moduł</h2>
    <p class="hint">Założę folder w katalogu modułów (<span id="rootdir"></span>) z pustą strukturą wymagań, tak jak <code>/sdd:init</code>.</p>
    <label>Nazwa modułu <small>małe litery, cyfry i myślnik, np. faktury-2026</small>
      <input name="name" required pattern="[a-z0-9][a-z0-9\-]{0,63}" autocomplete="off"></label>
    <label>Poziom
      <select name="level">
        <option value="full">pełny: dokument wymagań (PRD) dla biznesu + pliki dla programistów</option>
        <option value="light">lekki: jeden krótki SPEC.md, do małych rzeczy</option>
      </select></label>
    <label>Kto akceptuje wymagania, decyzje i słownik pojęć? <small>rola, nie osoba, np. właściciel procesu, kierownik działu</small>
      <input name="approver" value="właściciel procesu"></label>
    <label>Kto zatwierdza cały dokument na koniec? <small>opcjonalnie, np. sponsor, zarząd; puste = ta sama osoba co wyżej</small>
      <input name="sponsor" value="sponsor biznesowy"></label>
    <p class="err" id="moderr"></p>
    <div class="row">
      <button class="b" type="button" id="modcancel">Anuluj</button>
      <button class="b p" type="submit">Załóż moduł</button>
    </div>
  </form>
</dialog>
<script>
  var BASE=SddUI.base(location.pathname); // '' albo /demo (zmiana 0.12.0)
(function(){
  var $=function(s){return document.querySelector(s)};
  var STATUS={done:'gotowe',active:'w toku',todo:'nie zaczęte'};
  var LEVEL={full:'pełny',light:'lekki'};
  var KIND={monolith:'monolit',service:'serwis'};
  // etykiety licznikow: [klucz, etykieta, czy ostrzezenie gdy > 0]
  var LABELS={
    intake:[['sources','źródeł w spisie'],['unindexed','czeka na spis',1]],
    interview:[['questions','pytań'],['open','otwarte'],['asked','zadane biznesowi'],['conflicting','sprzeczne',1],['decisions','decyzji'],['unconfirmed','założeń niepotwierdzonych'],['refuted','obalonych',1]],
    domain:[['terms','haseł'],['approved','zatwierdzonych'],['missing','spoza słownika',1],['actors','ról'],['entities','encji'],['rules','reguł'],['systems','systemów']],
    spec:[['requirements','wymagań'],['approved','zatwierdzonych'],['review','do przeglądu']],
    validate:[['readiness','% gotowości'],['reports','raportów']],
    handover:[['traceability','tabela śledzenia'],['backlogs','backlogów']]
  };
  var last=null, uplog=[];
  function api(url,opts){
    opts=opts||{}; opts.headers=Object.assign({'X-SDD':'1'},opts.headers||{});
    return fetch(BASE+url,opts).then(function(r){return r.json().catch(function(){return {}}).then(function(j){if(!r.ok) throw new Error(j.error||(r.status===404?'Serwer jest starszy niż strona - zatrzymaj go (Ctrl+C) i uruchom ponownie.':'HTTP '+r.status)); return j})});
  }
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

  // Stan kart (zmiana 0.10.0): wybor usera per etap; aktualny krok rozwija sie po zmianie.
  var cardToggled={}, lastCurrent=null;
  // Stan etapu (0.34.0, AC-F3): klasa koloru, krotka etykieta na znaczniku, pelna w dymku, stan na pasku etapow.
  function stage(s,cur){
    // raport walidacji / przekazanie starsze niz wymagania (zmiana 0.18.0)
    if(s.stale) return {cls:'stale',tag:'nieaktualne',title:s.key==='handover'?'Wymagania zmieniły się po przekazaniu do budowy':'Wymagania zmieniły się po ostatniej walidacji',bar:'nieaktualne'};
    // gotowe, ale z pytaniami do wyjasnienia (zmiana 0.10.1)
    if(s.status==='done'&&s.partial) return {cls:'partial',tag:'gotowe · '+s.partial,title:'gotowe · '+s.partial+' do wyjaśnienia - etap nie blokuje dalszej pracy',bar:s.partial+' do wyjaśnienia'};
    var pct=s.key==='validate'&&typeof s.counts.readiness==='number'?' · '+s.counts.readiness+'%':'';

    if(!files.length) return h;
    var open=filesOpen===null?files.length<=8:filesOpen;
    return h+'<details class="files" id="filelist"'+(open?' open':'')+'><summary>Wrzucone pliki: <b>'+files.length+'</b> <code>00-intake/</code></summary><ul>'+
      files.map(function(f){return '<li class="f"><a class="fn" href="'+esc(BASE+'/api/intake?name='+encodeURIComponent(f.name))+'" download="'+esc(f.name.split('/').pop())+'" title="Pobierz '+esc(f.name)+'">'+esc(f.name)+'</a><span class="fs">'+size(f.size)+'</span>'+
        '<span class="tag'+(f.indexed?' ok':' work')+'">'+(f.indexed?'dodane':'czeka na spis')+'</span>'+
        (f.indexed?'<span class="rm-none" title="Plik jest już w spisie – nie można go usunąć"></span>':
          '<button type="button" class="rm" data-name="'+esc(f.name)+'" title="Usuń plik (czeka na spis)" aria-label="Usuń plik '+esc(f.name)+'">✕</button>')+'</li>'}).join('')+'</ul>'+
      '<p class="rmhint">✕ usuwa tylko pliki, które czekają na spis. Plików już zaindeksowanych („dodane”) nie można usunąć.</p></details>';
  }
  function wireDrop(){
    var d=$('#drop'); if(!d) return;
    d.onclick=function(){$('#files').click()};
    d.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();$('#files').click()}};
    d.ondragover=function(e){e.preventDefault();d.classList.add('over')};
    d.ondragleave=function(){d.classList.remove('over')};
    d.ondrop=function(e){e.preventDefault();d.classList.remove('over');upload(e.dataTransfer.files)};
  }
  function removeFile(name){
    if(!confirm('Usunąć plik „'+name+'”?\n\nPlik zostanie skasowany z dysku. Tego nie da się cofnąć.')) return;
    api('/api/intake?name='+encodeURIComponent(name),{method:'DELETE'})
      .then(function(){ uplog=[{cls:'dup',text:'usunięto '+name}]; if(last) render(last); })
      .catch(function(e){ uplog=[{cls:'bad',text:name+': '+e.message}]; if(last) render(last); });
  }
  function upload(list){
    var files=[].slice.call(list||[]); if(!files.length) return;
    var ok=[], dup=[], bad=[];
    function show(done){
      var many=files.length>3, l=[];
      var head=(done?'':'wysyłam '+(ok.length+dup.length+bad.length)+' z '+files.length+' · ')+'zapisano '+ok.length+
        (dup.length?', pominięto '+dup.length+' (już są)':'')+(bad.length?', błędy: '+bad.length:'');
      if(files.length>1||!done) l.push({cls:'sum',text:head});
      if(!many) ok.forEach(function(t){l.push({cls:'ok',text:'zapisano '+t+' → 00-intake/'})});
      dup.forEach(function(t){l.push({cls:'dup',text:t})});
      bad.forEach(function(t){l.push({cls:'bad',text:t})});
      uplog=l; if(last) render(last);
    }
    (function next(i){
      if(i>=files.length) return show(true);
      var f=files[i];
      if(f.size>25*1024*1024){ bad.push(f.name+': większy niż 25 MB'); return next(i+1); }
      api('/api/intake?name='+encodeURIComponent(f.name),{method:'POST',body:f})
        .then(function(j){ if(j.saved) ok.push(j.saved); else dup.push(f.name+': taki sam plik już jest jako '+j.duplicate); })
        .catch(function(e){ bad.push(f.name+': '+e.message); })
        .then(function(){ show(false); next(i+1); });
    })(0);
  }
  $('#files').onchange=function(e){upload(e.target.files); e.target.value='';};
  $('#modcancel').onclick=function(){ $('#dlg').close(); };
  $('#modform').onsubmit=function(e){
    e.preventDefault();
    var f=e.target, el=f.elements, body={name:el['name'].value.trim(),level:el.level.value,approver:el.approver.value.trim(),sponsor:el.sponsor.value.trim()};
    api('/api/modules',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
      .then(function(){ uplog=[]; f.reset(); $('#dlg').close(); })
      .catch(function(err){ $('#moderr').textContent=err.message; });
  };

  if(location.hash==='#nowy-modul'){ history.replaceState(null,'',location.pathname); $('#moderr').textContent=''; $('#dlg').showModal(); $('#modform').elements['name'].focus(); }

  function connect(){
    var es=new EventSource(BASE+'/progress-events');
    es.onopen=function(){$('#conn').textContent='połączono';$('#live').classList.remove('off')};
    es.onmessage=function(e){render(JSON.parse(e.data))};
    es.onerror=function(){$('#conn').textContent='rozłączono, ponawiam…';$('#live').classList.add('off')};
  }
  connect();
})();
</script>
</body>
</html>

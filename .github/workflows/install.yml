# Instalacja na prawdziwym Windows i macOS (spec: docs/specs/install.md, AC-I7).
# Prawdziwy Claude Code (npm, czyli claude.ps1 na Windows), bez atrap. Windows: domyslny Windows PowerShell 5.1
# i zasady wykonywania skryptow ustawione jak na zwyklym komputerze (Restricted).
name: install
on:
  push:
    paths: ['install.*', '.gitattributes', 'plugins/**', 'scripts/**', '.github/workflows/install.yml']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Claude Code (npm) i blokada skryptow jak na domowym Windows
        shell: powershell
        run: |
          npm install -g @anthropic-ai/claude-code
          Set-ExecutionPolicy -Scope CurrentUser -ExecutionPolicy Restricted -Force
          Set-ExecutionPolicy -Scope LocalMachine -ExecutionPolicy Restricted -Force -ErrorAction SilentlyContinue
          Get-ExecutionPolicy -List | Format-Table -AutoSize
          $PSVersionTable.PSVersion
      - name: install.cmd z folderu (dwuklik)
        shell: cmd
        run: echo.| install.cmd --update
      # Kroki "shell: powershell" GitHub uruchamia jako pliki .ps1 - przy Restricted bylyby zablokowane,
      # wiec sprawdzenia ida przez cmd i powershell -ExecutionPolicy Bypass -File (jak install.cmd).
      - name: Sprawdzenie - dodatek, sdd-board.cmd, panel
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\ci\check-windows.ps1 -Panel
      - name: Odinstalowanie
        shell: cmd
        run: echo.| install.cmd --uninstall
      - name: Jedna komenda (irm | iex) przy zasadach Restricted - tu z pliku z repo, ta sama droga co z GitHuba
        shell: cmd
        run: |
          echo.| powershell -NoProfile -Command "Get-Content -Raw install.ps1 | Invoke-Expression"
          if errorlevel 1 exit /b 1
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\ci\check-windows.ps1
      - name: Testy panelu na Windows (informacyjnie)
        continue-on-error: true
        shell: bash
        run: node --test --test-reporter=spec --test-timeout=30000 plugins/sdd/board/test/*.test.js scripts/test/*.test.js

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install -g @anthropic-ai/claude-code
      - name: install.sh --update
        run: bash install.sh --update
      - name: Sprawdzenie
        run: |
          claude plugin list | tee /dev/stderr | grep -q 'sdd@sdd-kit'
          test -x "$HOME/.local/bin/sdd-board"
      - name: Testy
        run: node --test --test-timeout=30000 plugins/sdd/board/test/*.test.js scripts/test/*.test.js
